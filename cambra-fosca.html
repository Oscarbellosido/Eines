=================================================================== */
function evToBase(e){
  const rc=view.getBoundingClientRect();
  return { x:(e.clientX-rc.left)/S.zoom, y:(e.clientY-rc.top)/S.zoom };
}
function updateCursorSize(){
  const c=$('#cursor'), d=S.brush.size*S.zoom;
  c.style.width=d+'px'; c.style.height=d+'px';
  c.style.marginLeft=(-d/2)+'px'; c.style.marginTop=(-d/2)+'px';
}
/* Mentre pintes, nomes es torna a dibuixar la pinzellada d'ara damunt de com
   estava la capa abans de comencar-la. Si es tornessin a pintar totes a cada
   moviment del dit, amb cent pinzellades fetes el pinzell ja aniria a batzegades. */
let stroke=null, paintSnap=null, paintSnapCtx=null, ratllaMasc=null;
function savePaintSnap(){
  if(!paintSnap||paintSnap.width!==paintCanvas.width||paintSnap.height!==paintCanvas.height){
    paintSnap=mkCanvas(paintCanvas.width,paintCanvas.height);
    paintSnapCtx=paintSnap.getContext('2d');
  }
  paintSnapCtx.clearRect(0,0,paintSnap.width,paintSnap.height);
  paintSnapCtx.drawImage(paintCanvas,0,0);
}
function restorePaintSnap(){
  paintCtx.clearRect(0,0,paintCanvas.width,paintCanvas.height);
  paintCtx.drawImage(paintSnap,0,0);
}
view.addEventListener('pointerdown',e=>{
  if(!baseCanvas||cropOn) return;
  const p=evToBase(e);
  const t=S.tool;

  if(t==='pick'){
    const px=workCtx.getImageData(round(p.x*renderScale),round(p.y*renderScale),1,1).data;
    const hex='#'+[px[0],px[1],px[2]].map(n=>n.toString(16).padStart(2,'0')).join('');
    S.brush.color=hex; buildOpts('pick',TOOLS.find(x=>x.id==='pick').hint);
    say('Color agafat: '+hex);
    return;
  }
  if(t==='text'){ showTextEdit(p,e); return; }
  if(t==='move'){
    const st=$('#stage'); st.classList.add('panning');
    const sx=st.scrollLeft, sy=st.scrollTop, cx=e.clientX, cy=e.clientY;
    view.setPointerCapture(e.pointerId);
    const mv=ev=>{ st.scrollLeft=sx-(ev.clientX-cx); st.scrollTop=sy-(ev.clientY-cy); };
    const up=()=>{ st.classList.remove('panning'); view.removeEventListener('pointermove',mv); view.removeEventListener('pointerup',up); view.removeEventListener('pointercancel',up); };
    view.addEventListener('pointermove',mv); view.addEventListener('pointerup',up); view.addEventListener('pointercancel',up);
    return;
  }
  if(t==='clone'){
    if(e.altKey){
      S.cloneSrc=[p.x,p.y];
      const m=$('#cloneSrc');
      m.style.display='block'; m.style.left=(p.x*S.zoom)+'px'; m.style.top=(p.y*S.zoom)+'px';
      say('Origen del tampó fixat.');
      return;
    }
    if(!S.cloneSrc){ say('Fes Alt+clic per fixar l\'origen del tampó.'); return; }
  }
  if(t==='treu'){
    if(IA.treballant) return;
    e.preventDefault();
    view.setPointerCapture(e.pointerId);
    ratllaMasc={pts:[p.x,p.y], size:S.brush.size};
    S.mascara.push(ratllaMasc);
    demanaVista();
    return;
  }
  if(t!=='brush'&&t!=='eraser'&&t!=='clone') return;

  e.preventDefault();
  view.setPointerCapture(e.pointerId);
  stroke={
    type: t==='eraser'?'erase':(t==='clone'?'clone':'brush'),
    pts:[p.x,p.y],
    size:S.brush.size, hardness:S.brush.hardness, opacity:S.brush.opacity,
    color:S.brush.color,
    src: t==='clone'? S.cloneSrc.slice() : null,
  };
  ensurePaint();
  savePaintSnap();
  S.ops.push(stroke);
  drawOp(stroke); scheduleRender();
});
view.addEventListener('pointermove',e=>{
  if(!baseCanvas) return;
  const p=evToBase(e);
  $('#stPos').textContent=round(p.x)+', '+round(p.y);
  const painty=(S.tool==='brush'||S.tool==='eraser'||S.tool==='clone'||S.tool==='treu')&&!cropOn;
  const cur=$('#cursor');
  if(painty){
    cur.style.display='block'; updateCursorSize();
    cur.style.left=(p.x*S.zoom)+'px'; cur.style.top=(p.y*S.zoom)+'px';
  } else cur.style.display='none';
  if(ratllaMasc){
    const q=ratllaMasc.pts, m=q.length;
    if(Math.hypot(p.x-q[m-2],p.y-q[m-1])<Math.max(0.7,ratllaMasc.size*0.07)) return;
    q.push(p.x,p.y); demanaVista();
    return;
  }
  if(!stroke) return;
  const n=stroke.pts.length;
  if(Math.hypot(p.x-stroke.pts[n-2],p.y-stroke.pts[n-1])<Math.max(0.7,S.brush.size*0.07)) return;
  stroke.pts.push(p.x,p.y);
  restorePaintSnap(); drawOp(stroke); scheduleRender();
});
function endStroke(e){
  if(ratllaMasc){
    ratllaMasc=null;
    try{ view.releasePointerCapture(e.pointerId); }catch(_){}
    estatTreu();
    say('Quan ho tinguis tot de vermell, prem «Esborra-ho».');
    return;
  }
  if(!stroke) return;
  const label={brush:'Pinzellada',erase:'Esborrat',clone:'Clonació'}[stroke.type];
  stroke=null;
  try{ view.releasePointerCapture(e.pointerId); }catch(_){}
  push(label);
}
view.addEventListener('pointerup',endStroke);
view.addEventListener('pointercancel',endStroke);
view.addEventListener('pointerleave',()=>{ if(!stroke&&!ratllaMasc) $('#cursor').style.display='none'; });

function loadImage(src,name,isSample){
  const img=new Image();
  img.onload=()=>{
    const c=mkCanvas(img.naturalWidth,img.naturalHeight);
    c.getContext('2d').drawImage(img,0,0);
    adopt(c,name,isSample);
  };
  img.onerror=()=>say('No s\'ha pogut llegir aquesta imatge.');
  img.src=src;
}
function adopt(canvas,name,isSample){
  if(IA.treballant) IA.atura=true;
  S.endreca=0; if($('#sl-endreca')) pintaEndreca();
  if($('#arreglaRes')) $('#arreglaRes').hidden=true;
  IA.factorTriat=false;
  S.src=canvas; S.name=name||'imatge.png'; S.sample=!!isSample;
  S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
  S.adj=Object.assign({},ADJ_DEF); S.preset='cap';
  S.ops=[]; S.cloneSrc=null; $('#cloneSrc').style.display='none';
  paintCanvas=paintCtx=scratch=scratchCtx=null; thumbSrc=null;
  S.history=[]; S.hIndex=-1;
  buildBase(); syncSliders(); markPreset();
  $('#fileName').textContent=S.name;
  fitToStage(); push('Obre '+S.name);
  if(S.tool==='crop') startCrop();
  if($('#pane-amp').classList.contains('on')) pintaAmplia();
  say(isSample
    ? 'Imatge d\'exemple generada per la pàgina. Obre\'n una teva per començar.'
    : S.src.width+' × '+S.src.height+' px carregats.');
}
function openFile(f){
  if(!f) return;
  if(!/^image\//.test(f.type)){ say('Aquest fitxer no és una imatge.'); return; }
  const r=new FileReader();
  r.onload=()=>loadImage(r.result,f.name,false);
  r.onerror=()=>say('No s\'ha pogut llegir el fitxer.');
  r.readAsDataURL(f);
}
$('#file').onchange=e=>{ openFile(e.target.files[0]); e.target.value=''; };
$('#btnOpen').onclick=()=>$('#file').click();

let dragDepth=0;
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{
  if(!e.dataTransfer||![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); dragDepth++; $('#drop').classList.add('on');
}));
['dragleave','dragend'].forEach(t=>document.addEventListener(t,()=>{
  dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) $('#drop').classList.remove('on');
}));
document.addEventListener('drop',e=>{
  if(!e.dataTransfer) return;
  e.preventDefault(); dragDepth=0; $('#drop').classList.remove('on');
  openFile(e.dataTransfer.files&&e.dataTransfer.files[0]);
});
document.addEventListener('paste',e=>{
  const it=e.clipboardData&&e.clipboardData.items;
  if(!it) return;
  for(const i of it) if(i.type&&i.type.startsWith('image/')){ openFile(i.getAsFile()); break; }
});

function dialog(title,build,onOk,okLabel){
  const scrim=el('div','scrim');
  const d=el('div','dlg');
  d.innerHTML='<header><h3></h3></header><div class="content"></div><footer></footer>';
  d.querySelector('h3').textContent=title;
  const body=d.querySelector('.content'), foot=d.querySelector('footer');
  build(body);
  const close=()=>scrim.remove();
  const cancel=el('button','btn','Tanca'); cancel.type='button'; cancel.onclick=close;
  foot.appendChild(cancel);
  if(onOk){
    const ok=el('button','btn primary',okLabel||'D\'acord'); ok.type='button';
    ok.onclick=()=>onOk(close,ok);
    foot.appendChild(ok);
  }
  scrim.appendChild(d);
  scrim.addEventListener('pointerdown',e=>{ if(e.target===scrim) close(); });
  document.body.appendChild(scrim);
  return {close, scrim};
}
// A la web de debo, una baixada normal del navegador. Dins d'un artifact de
// claude.ai la pagina no pot baixar res ella mateixa i ho ha de demanar a la
// plataforma: per aixo es prova primer alla i, si no hi es, l'enllac.
function desaFitxer(blob,nom){
  if(downloads) return downloads.save({filename:nom,data:blob});
  return new Promise((res,rej)=>{
    try{
      const u=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=u; a.download=nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),30000);
      res({status:'saved'});
    }catch(err){ rej({code:'unavailable',message:String(err)}); }
  });
}
function baseName(){
  const n=S.name.replace(/\.[^.]+$/,'');
  return (n||'imatge')+'-retocada';
}

/* ===================================================================
   16. ampliar amb IA
   Les mateixes xarxes neuronals que fa servir Upscayl (Real-ESRGAN), fent
   córrer dins del navegador amb ONNX Runtime. La foto no surt de l'aparell:
   el que es baixa (una sola vegada) és el motor i el model, del mateix web.
   N'hi ha dos: el lleuger, per al mòbil, i el gran, per a l'ordinador.
=================================================================== */
const IA={
  DIR:'ia/',
  CAU:'cambra-fosca-ia-1',
  MARGE:16,               // píxels de context al voltant de cada tros, que no es vegin les costures
  models:{
    // macPx: multiplicacions per píxel d'entrada, per saber a quina velocitat ha anat
    mobil:{ fitxer:'models/realesr-general-x4v3-v2.onnx', mb:4.9, nom:'Mòbil', model:'lleuger',
            desc:'Model lleuger. Va ràpid i serveix a qualsevol aparell.', tros:{gpu:192,cpu:128}, maxMP:16, macPx:1.25e6 },
    ordinador:{ fitxer:'models/realesrgan-x4plus.onnx', mb:66.9, nom:'Ordinador', model:'gran',
            desc:'Model gran: més qualitat, però més lent i amb més memòria.', tros:{gpu:128,cpu:96}, maxMP:64, macPx:1.79e7 },
  },
  motors:{
    gpu:{ script:'ort/ort.webgpu.min.js', wasm:'ort/ort-wasm-simd-threaded.asyncify.wasm', mb:28.7 },
    cpu:{ script:'ort/ort.wasm.min.js',   wasm:'ort/ort-wasm-simd-threaded.wasm',          mb:14.8 },
  },
  mode:null, factor:4,
  factorTriat:false,      // si l'ha triat la persona, no es canvia sol (abans passava a ×2 sense dir res)
  motor:null,             // 'gpu' si l'aparell pot fer servir la gràfica, 'cpu' si no; null mentre es mira
  carregat:null, sessio:null, sessioDe:null,
  treballant:false, atura:false,
  baixats:{},             // què ja hi ha a la memòria del navegador
  error:null,
  // «Esborra coses»: MI-GAN, de Picsart. Sempre treballa a 512 × 512.
  treu:{ fitxer:'models/migan-512.onnx', mb:25.5, N:512, sessio:null, motorReal:null, errorGPU:null, ultim:null },
};

/* El que és un mòbil, de partida: pantalla de dit i petita. Es pot canviar. */
IA.mode = (matchMedia('(pointer:coarse)').matches && Math.min(screen.width,screen.height)<820) ? 'mobil' : 'ordinador';

async function miraGPU(){
  try{
    if(!navigator.gpu) return false;
    return !!(await navigator.gpu.requestAdapter());
  }catch(e){ return false; }
}
const urlIA = cami => new URL(IA.DIR+cami, location.href).href;
async function cauIA(){ try{ return self.caches ? await caches.open(IA.CAU) : null; }catch(e){ return null; } }
async function miraBaixats(){
  const c=await cauIA(); if(!c) return;
  // la primera versió del model lleuger, que la gràfica no sabia fer anar sencera
  try{ await c.delete(urlIA('models/realesr-general-x4v3.onnx')); }catch(e){}
  const fitxers=[IA.models.mobil.fitxer, IA.models.ordinador.fitxer, IA.treu.fitxer, IA.motors.gpu.wasm, IA.motors.cpu.wasm];
  for(const f of fitxers){ try{ IA.baixats[f]=!!(await c.match(urlIA(f))); }catch(e){} }
}
/* Baixa un fitxer gros una sola vegada: després el treu de la memòria del
   navegador (Cache Storage), també sense connexió. */
async function baixaIA(cami, progres){
  const url=urlIA(cami), c=await cauIA();
  if(c){ const r=await c.match(url); if(r) return new Uint8Array(await r.arrayBuffer()); }
  const r=await fetch(url);
  if(!r.ok) throw new Error('no s\'ha pogut baixar '+cami.split('/').pop()+' ('+r.status+')');
  const total=+r.headers.get('content-length')||0;
  let buf;
  if(r.body && r.body.getReader){
    const lector=r.body.getReader(), trossos=[]; let rebut=0;
    for(;;){
      const {done,value}=await lector.read(); if(done) break;
      trossos.push(value); rebut+=value.length; progres(rebut,total);
    }
    buf=new Uint8Array(rebut); let o=0; for(const t of trossos){ buf.set(t,o); o+=t.length; }
  } else buf=new Uint8Array(await r.arrayBuffer());
  if(c){ try{ await c.put(url, new Response(buf.slice(0), {headers:{'content-type':'application/octet-stream'}})); IA.baixats[cami]=true; }catch(e){} }
  return buf;
}
function carregaScript(src){
  return new Promise((ok,ko)=>{
    const sc=document.createElement('script'); sc.src=src;
    sc.onload=ok; sc.onerror=()=>ko(new Error('no s\'ha pogut carregar el motor'));
    document.head.appendChild(sc);
  });
}
async function preparaMotor(progres){
  if(IA.carregat) return;
  const m=IA.motors[IA.motor];
  const wasm=await baixaIA(m.wasm, (a,t)=>progres('el motor',a,t||m.mb*1048576));
  await carregaScript(urlIA(m.script));
  if(!self.ort) throw new Error('el motor no s\'ha engegat');
  ort.env.wasm.wasmPaths=urlIA('ort/');
  ort.env.wasm.wasmBinary=wasm;
  ort.env.wasm.numThreads=1;         // els fils demanen unes capçaleres que GitHub no envia
  // Sense gràfica, el motor treballa en un fil a part: si no, el navegador es
  // quedaria glaçat mentre fa cada tros.
  if(IA.motor==='cpu') ort.env.wasm.proxy=true;
  IA.carregat=IA.motor;
}
async function preparaSessio(progres){
  if(IA.sessio && IA.sessioDe===IA.mode) return IA.sessio;
  if(IA.sessio){ try{ await IA.sessio.release(); }catch(e){} IA.sessio=null; IA.sessioDe=null; }
  const md=IA.models[IA.mode];
  const bytes=await baixaIA(md.fitxer, (a,t)=>progres('el model',a,t||md.mb*1048576));
  progres('preparant el model',0,0);
  const r=await creaSessio(bytes);
  IA.sessio=r.sessio; IA.motorReal=r.motorReal; IA.errorGPU=r.errorGPU;
  IA.sessioDe=IA.mode;
  return IA.sessio;
}
// Primer amb la gràfica sola, i només si no arrenca, amb el processador. Abans
// es demanaven totes dues de cop, i si la gràfica fallava el motor passava al
// processador sense dir res: l'usuari va esperar una hora sense saber per què.
async function creaSessio(bytes){
  let sessio=null, motorReal=null, errorGPU=null;
  if(IA.motor==='gpu'){
    try{
      sessio=await ort.InferenceSession.create(bytes.slice(0), { executionProviders:['webgpu'], graphOptimizationLevel:'all' });
      motorReal='gpu';
    }catch(e){ errorGPU=String(e&&e.message||e).replace(/\s+/g,' ').slice(0,140); console.warn('IA: la gràfica no arrenca',e); }
  }
  if(!sessio){
    sessio=await ort.InferenceSession.create(bytes, { executionProviders:['wasm'], graphOptimizationLevel:'all' });
    motorReal='cpu';
  }
  return { sessio, motorReal, errorGPU };
}
// El navegador i la versió, per a la línia de detalls (Edg/131 → Edge 131).
// L'Edge, l'Opera i el Samsung també diuen «Chrome/...», i abans d'això: es
// busca primer el nom propi i, només si no hi és, Chrome. Abans s'agafava el
// primer que sortia, i l'Edge de l'usuari sortia com a «Chrome 157».
function quinNavegador(ua=navigator.userAgent){
  for(const [clau,nom] of [['Edg','Edge'],['OPR','Opera'],['SamsungBrowser','Samsung Internet'],['Firefox','Firefox'],['Chrome','Chrome'],['Version','Safari']]){
    const m=ua.match(new RegExp(clau+'/(\\d+)'));
    if(m) return nom+' '+m[1];
  }
  return 'navegador desconegut';
}

/* La feina, per trossos. Cada tros es passa pel model amb un marge de context
   al voltant (fora de la foto, es repeteix la vora) i només se'n queda el mig:
   així no es veuen les costures i la memòria no depèn de la mida de la foto.
   Els trossos fan sempre la mateixa mida, que la gràfica no hagi de tornar a
   preparar-se a cada un. El model sempre amplia per 4; per a ×2, cada tros es
   redueix a la meitat abans de posar-lo, amb el seu marge i tot. */
async function ampliaImatge(src, sessio, f, T, cadaTros){
  const W=src.width, H=src.height, P=IA.MARGE;
  const tw=Math.min(T,W), th=Math.min(T,H), iw=tw+2*P, ih=th+2*P;
  const cols=Math.ceil(W/tw), files=Math.ceil(H/th), total=cols*files;
  const px=src.getContext('2d').getImageData(0,0,W,H).data;
  let alfa=false; for(let i=3;i<px.length;i+=4) if(px[i]<255){ alfa=true; break; }
  const out=mkCanvas(W*f,H*f), ox=out.getContext('2d');
  const t4=mkCanvas(iw*4,ih*4), t4x=t4.getContext('2d');
  const img=t4x.createImageData(iw*4,ih*4), d=img.data;
  let t2=null, t2x=null;
  if(f===2){ t2=mkCanvas(iw*2,ih*2); t2x=t2.getContext('2d'); t2x.imageSmoothingQuality='high'; }
  let ta=null, tax=null;
  if(alfa){ ta=mkCanvas(iw*4,ih*4); tax=ta.getContext('2d',{willReadFrequently:true}); tax.imageSmoothingQuality='high'; }
  const nomE=sessio.inputNames[0], nomS=sessio.outputNames[0], pla=iw*ih, p4=pla*16;
  let n=0;
  for(let r=0;r<files;r++) for(let c=0;c<cols;c++){
    if(IA.atura) throw new Error('aturat');
    const x0=Math.min(c*tw,W-tw), y0=Math.min(r*th,H-th);
    const e=new Float32Array(3*pla);   // un de nou cada vegada: el fil del motor se l'endú
    for(let y=0;y<ih;y++){
      const fila=clamp(y0-P+y,0,H-1)*W;
      for(let x=0;x<iw;x++){
        const k=(fila+clamp(x0-P+x,0,W-1))*4, o=y*iw+x;
        e[o]=px[k]/255; e[o+pla]=px[k+1]/255; e[o+2*pla]=px[k+2]/255;
      }
    }
    const res=await sessio.run({[nomE]: new ort.Tensor('float32', e, [1,3,ih,iw])});
    const sortida=res[nomS], y=sortida.data;
    for(let i=0,j=0;i<p4;i++,j+=4){ d[j]=y[i]*255; d[j+1]=y[i+p4]*255; d[j+2]=y[i+2*p4]*255; d[j+3]=255; }
    if(sortida.dispose) sortida.dispose();
    if(alfa){
      // la transparència no la toca el model: s'amplia a part, a la manera normal
      tax.clearRect(0,0,ta.width,ta.height);
      tax.drawImage(src, x0-P, y0-P, iw, ih, 0, 0, iw*4, ih*4);
      const a=tax.getImageData(0,0,ta.width,ta.height).data;
      for(let j=3;j<d.length;j+=4) d[j]=a[j];
    }
    t4x.putImageData(img,0,0);
    const dx=x0*f, dy=y0*f, dw=tw*f, dh=th*f;
    ox.clearRect(dx,dy,dw,dh);
    if(f===4) ox.drawImage(t4, 4*P,4*P,4*tw,4*th, dx,dy,dw,dh);
    else { t2x.clearRect(0,0,t2.width,t2.height); t2x.drawImage(t4,0,0,t2.width,t2.height);
           ox.drawImage(t2, 2*P,2*P,2*tw,2*th, dx,dy,dw,dh); }
    n++; await cadaTros(n,total);      // pot esperar una resposta (si trigarà molt)
  }
  return out;
}

const mb = n => (n>=10 ? Math.round(n) : n.toFixed(1).replace('.',','))+' MB';
// «45 s», «3 min 20 s», «55 min», «1 h 10 min»: a partir de deu minuts els segons ja no diuen res
const minuts = s => {
  s=Math.max(1,round(s));
  if(s<60) return s+' s';
  if(s<3600){ const m=Math.floor(s/60), r=s%60; return m+' min'+(m<10&&r?' '+String(r).padStart(2,'0')+' s':''); }
  const h=Math.floor(s/3600), m=round((s%3600)/60);
  return h+' h'+(m?' '+m+' min':'');
};
function midaResultat(f){
  return { w:baseCanvas.width*f, h:baseCanvas.height*f, mp:baseCanvas.width*f*baseCanvas.height*f/1e6 };
}
function hiCap(f){ return midaResultat(f).mp <= IA.models[IA.mode].maxMP; }

function pintaAmplia(){
  const pane=$('#pane-amp'); if(!pane || !baseCanvas) return;
  // De partida, ×4 si hi cap i ×2 si no; però si la persona ha triat ×4 i no
  // hi cap, es queda ×4 i se li diu per què no pot.
  if(!IA.factorTriat) IA.factor = hiCap(4) ? 4 : 2;
  const md=IA.models[IA.mode], res=midaResultat(IA.factor), cap=hiCap(IA.factor);
  pane.textContent='';

  // Després d'ampliar, a dalt de tot es diu que s'ha fet. Sense això, l'usuari
  // va esperar una hora i el primer que va veure va ser l'avís vermell de «no
  // hi cap», que parlava de tornar-la a ampliar: es pensava que havia fallat.
  if(IA.fet && IA.fet.src===S.src){
    const ok=el('div','ia-fet'); ok.id='iaFet';
    ok.innerHTML='<b>✓ Feta.</b> '+IA.fet.text;
    if(IA.fet.detalls){ const d=el('div','ia-detalls',IA.fet.detalls); d.id='iaDetalls'; ok.appendChild(d); }
    pane.appendChild(ok);
  }
  const g1=el('div','grp');
  g1.appendChild(el('h4',null,'Amplia amb IA'));
  g1.appendChild(el('div','tiny','Fa la foto més gran i s\'inventa el detall que hi falta, com Upscayl. Va molt bé amb fotos petites o borroses; el que s\'ha perdut del tot no ho recupera. La foto no surt del teu aparell.'));
  pane.appendChild(g1);

  const g2=el('div','grp'); g2.appendChild(el('h4',null,'On ho fas'));
  const modes=el('div','modes');
  for(const k of ['mobil','ordinador']){
    const m=IA.models[k], b=el('button','mode');
    b.type='button'; b.id='iaMode-'+k; b.setAttribute('aria-pressed', k===IA.mode?'true':'false');
    b.innerHTML='<b>'+m.nom+'<em>'+mb(m.mb)+'</em></b><span>'+m.desc+'</span>';
    b.onclick=()=>{ IA.mode=k; IA.factorTriat=false; pintaAmplia(); };
    modes.appendChild(b);
  }
  g2.appendChild(modes); pane.appendChild(g2);

  const g3=el('div','grp'); g3.appendChild(el('h4',null,'Quant més gran'));
  const chips=el('div','chips');
  for(const f of [2,4]){
    const c=el('button','chip','×'+f); c.type='button'; c.id='iaF-'+f;
    c.setAttribute('aria-pressed', f===IA.factor?'true':'false');
    c.onclick=()=>{ IA.factor=f; IA.factorTriat=true; pintaAmplia(); };
    chips.appendChild(c);
  }
  g3.appendChild(chips);
  g3.appendChild(el('div','ia-res'+(cap?'':' ia-mal'),
    baseCanvas.width+' × '+baseCanvas.height+' → '+res.w+' × '+res.h+' px'));
  if(!cap){
    // Quan no hi cap, es diu per què, segons el cas. Abans sortia sempre el
    // mateix («faria tants megapíxels, retalla»), i amb una foto de 50
    // megapíxels l'usuari no entenia per què no la deixava ampliar.
    const ara=round(baseCanvas.width*baseCanvas.height/1e6);
    const enOrdinador=midaResultat(IA.factor).mp<=IA.models.ordinador.maxMP;
    const jaAmpliada=S.history.slice(0,S.hIndex+1).some(h=>h.label.startsWith('Amplia'));
    let t;
    if(hiCap(2))          // només ×4 és massa
      t='Per 4 faria '+round(res.mp)+' megapíxels, i en aquest mode el màxim és '+md.maxMP+': no cabria a la memòria. Tria ×2'+
        (IA.mode==='mobil'&&enOrdinador?', o fes-ho des de l\'ordinador.':'.');
    else if(jaAmpliada)
      t='Aquesta foto ja l\'has ampliada, i ja fa '+ara+' megapíxels. Tornar-la a ampliar no hi afegiria res: el model s\'inventaria detall a sobre del que ja s\'havia inventat, i no cabria a la memòria.';
    else if(ara>IA.models.ordinador.maxMP/4)
      t='Aquesta foto ja és molt gran: fa '+ara+' megapíxels, més del que cal per veure-la o imprimir-la. Ampliar-la no hi guanya res, i no cabria a la memòria. L\'ampliació és per a fotos petites o borroses.';
    else                  // al mòbil, una foto normal
      t='Al mòbil, el resultat pot fer com a molt '+md.maxMP+' megapíxels, i aquesta foto ja en fa '+ara+'.'+
        (enOrdinador?' Des de l\'ordinador sí que es pot.':'');
    t+=' Si vols veure més gran un tros, retalla\'l primer i amplia només aquell tros.';
    // en taronja i no en vermell: no és cap error, és per què no es pot
    const avis=el('div','tiny ia-avis',t); avis.id='iaNoHiCap';
    g3.appendChild(avis);
  }
  pane.appendChild(g3);

  const linies=el('div','ia-linies'); linies.id='iaLinies';
  const linia=(t,c)=>linies.appendChild(el('div','tiny'+(c?' '+c:''),t));
  if(IA.motor==null) linia('Mirant si aquest aparell pot fer servir la gràfica…');
  else if(IA.motor==='gpu' && IA.motorReal==='cpu'){
    linia('El navegador diu que té gràfica, però el motor no l\'ha pogut fer arrencar: va amb el processador, que és molt més lent.','ia-avis');
    if(IA.errorGPU) linia('Motiu: '+IA.errorGPU);
  }
  else if(IA.motor==='gpu') linia('Farà servir la gràfica de l\'aparell, que és el que el fa anar de pressa.');
  else {
    linia('Aquest aparell no pot fer servir la gràfica: anirà amb el processador, que és més lent.');
    if(IA.mode==='ordinador') linia('Amb el model gran i sense gràfica pot trigar molts minuts. El de mòbil va molt més de pressa.','ia-avis');
  }
  if(IA.motor){
    const falta=[];
    const mot=IA.motors[IA.motor];
    if(!IA.baixats[mot.wasm] && IA.carregat!==IA.motor) falta.push(mot.mb);
    if(!IA.baixats[md.fitxer] && !(IA.sessio && IA.sessioDe===IA.mode)) falta.push(md.mb);
    const suma=falta.reduce((a,b)=>a+b,0);
    linia(suma ? 'La primera vegada es baixen '+mb(suma)+' (el motor i el model). Després queden desats en aquest navegador.'
               : 'El motor i el model ja són en aquest navegador: no cal baixar res.');
  }
  if(IA.error) linia('L\'última vegada no ha funcionat: '+IA.error+'.','ia-mal');
  pane.appendChild(linies);

  const go=el('button','btn primary','Amplia ×'+IA.factor); go.type='button'; go.id='iaGo';
  go.disabled=!cap || IA.motor==null || IA.treballant;
  go.onclick=fesAmplia;
  pane.appendChild(go);
}

function vel(text, part, detall){
  $('#vel').hidden=false;
  $('#velText').textContent=text;
  $('#velBarra').style.width=round(clamp(part,0,1)*100)+'%';
  $('#velDetall').textContent=detall||'';
}
$('#velAtura').onclick=()=>{ IA.atura=true; $('#velText').textContent='Aturant…'; };

/* Si veu que trigarà més de 3 minuts (IA.LLARG), ho diu de seguida i
   pregunta. L'usuari va ampliar amb el model gran una foto de 3 megapíxels i
   va estar una hora esperant sense que ningú li hagués dit res. */
IA.LLARG=180;
function preguntaTemps(queda){
  return new Promise(resol=>{
    const t=$('#velPreguntaText');
    let h='Això trigarà <b>uns '+minuts(queda)+'</b>.';
    if(IA.motor==='gpu' && IA.motorReal==='cpu') h+=' La gràfica no ha arrencat i va amb el processador.';
    if(IA.mode==='ordinador')
      h+=' El model gran fa unes 15 vegades més feina que el del mòbil. Si no et cal tanta qualitat, atura i tria <b>Mòbil</b>'+
         (hiCapEn('mobil',IA.factor)?'':', retallant primer el tros que vulguis')+'.';
    else h+=' Si vols que vagi més de pressa, atura i retalla primer el tros que vulguis.';
    h+=' Si continues, deixa aquesta pàgina oberta.';
    t.innerHTML=h;
    $('#velAtura').hidden=true; $('#velPregunta').hidden=false;
    const acaba=si=>{ $('#velPregunta').hidden=true; $('#velAtura').hidden=false; resol(si); };
    $('#velSegueix').onclick=()=>acaba(true);
    $('#velNo').onclick=()=>acaba(false);
  });
}
function hiCapEn(mode,f){ return midaResultat(f).mp <= IA.models[mode].maxMP; }

/* Mentre amplia, que la pantalla no s'apagui: si s'apaga, el mòbil atura la
   pàgina i la feina es queda a mig fer. Quan la pàgina torna a ser visible,
   es torna a demanar (el navegador ho deixa anar en amagar-la). */
let bloqueigPantalla=null;
async function mantenEncesa(){
  try{ if(navigator.wakeLock && IA.treballant && document.visibilityState==='visible') bloqueigPantalla=await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(IA.treballant) mantenEncesa(); });

/* El títol de la pestanya diu per on va, i al final una ✓: així es veu des
   d'una altra pestanya. Es torna a deixar com era quan es mira la pàgina. */
const TITOL=document.title;
function titolFet(text){
  document.title=text;
  const torna=()=>setTimeout(()=>{ if(!IA.treballant) document.title=TITOL; },6000);
  if(document.visibilityState==='visible') torna();
  else document.addEventListener('visibilitychange',function v(){ if(document.visibilityState==='visible'){ document.removeEventListener('visibilitychange',v); torna(); } });
}

async function fesAmplia(){
  if(IA.treballant || !baseCanvas || !hiCap(IA.factor)) return;
  cancelaEndreca();
  if(cropOn){ endCrop(false); setTool('move'); }
  hideTextEdit();
  IA.treballant=true; IA.atura=false; IA.error=null;
  const f=IA.factor, md=IA.models[IA.mode], src=baseCanvas, t0=performance.now();
  const midaAbans=src.width+' × '+src.height;
  mantenEncesa();
  try{
    const progres=(que,a,t)=>{
      if(IA.atura) throw new Error('aturat');
      vel(t ? 'Baixant '+que+'…' : 'Preparant el model…', t ? a/t : 0, t ? mb(a/1048576)+' de '+mb(t/1048576) : 'Només la primera vegada.');
    };
    vel('Preparant…',0,'');
    await preparaMotor(progres);
    const sessio=await preparaSessio(progres);
    let tInici=0, preguntat=false, trossos=0;
    vel('Ampliant…',0,'Començant pel primer tros…');
    const T=md.tros[IA.motor];
    const out=await ampliaImatge(src, sessio, f, T, async (n,total)=>{
      trossos=total;
      // el primer tros porta la preparació de la gràfica: el compte comença al segon
      if(n===1) tInici=performance.now();
      let detall='Tros '+n+' de '+total, queda=0;
      if(n>=2){ queda=(performance.now()-tInici)/(n-1)*(total-n)/1000; detall+=' · queden uns '+minuts(queda); }
      vel('Ampliant ×'+f+'…', n/total, detall);
      document.title=round(n/total*100)+'% · Ampliant · '+TITOL;
      if(n>=2 && !preguntat && queda>IA.LLARG){
        preguntat=true;
        const t=performance.now();
        if(!(await preguntaTemps(queda))) IA.atura=true;
        tInici+=performance.now()-t;     // el temps de pensar-s'ho no compta per al càlcul
      }
    });
    if(IA.atura) throw new Error('aturat');
    // La foto ampliada passa a ser la foto: els girs i el retall ja hi són
    // aplicats, i les pinzellades es fan grans amb ella.
    S.src=out; S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
    mapOps((x,y)=>[x*f,y*f]);
    for(const op of S.ops) if(op.size) op.size*=f;
    S.cloneSrc=null; $('#cloneSrc').style.display='none';
    buildBase(); fitToStage();
    push('Amplia ×'+f+' · model '+md.model);
    const temps=minuts((performance.now()-t0)/1000);
    // A quina velocitat ha anat (milers de milions d'operacions per segon),
    // sense el primer tros, que porta la preparació. Amb la gràfica han de
    // ser centenars; amb el processador, poques desenes. És el que diu, amb
    // números, si la gràfica s'ha fet servir de debò.
    const iw=Math.min(T,src.width)+2*IA.MARGE, ih=Math.min(T,src.height)+2*IA.MARGE;
    const segons=(performance.now()-tInici)/1000;
    const gflops=trossos>1&&segons>0 ? round(2*md.macPx*iw*ih*(trossos-1)/segons/1e9) : null;
    const amb=IA.motorReal==='gpu'?'amb la gràfica':'amb el processador';
    IA.fet={ src:S.src,
      text:'Ampliada ×'+f+' amb el model '+md.model+', '+amb+', en '+temps+': de '+midaAbans+' a '+out.width+' × '+out.height+' px. Ara desa-la amb el botó <b>Desa</b>.',
      detalls:'Detalls per a qui ho hagi de revisar: '+quinNavegador()+' · '+(IA.motorReal==='gpu'?'gràfica':'processador'+(IA.errorGPU?' (la gràfica no ha arrencat)':''))+
              (gflops!=null?' · '+gflops+' GFLOP/s':'')+' · '+trossos+' trossos de '+iw+' × '+ih };
    say('Ampliada a '+out.width+' × '+out.height+' px en '+temps+'.');
    titolFet('✓ Ampliada · '+TITOL);
  }catch(e){
    const msg=String(e&&e.message||e);
    document.title=TITOL;
    if(msg==='aturat') say('Ampliació aturada. La foto és com era.');
    else { IA.error=msg; say('No s\'ha pogut ampliar: '+msg+'.'); console.warn('Amplia:',e); }
  }finally{
    IA.treballant=false; IA.atura=false;
    try{ if(bloqueigPantalla) await bloqueigPantalla.release(); }catch(e){}
    bloqueigPantalla=null;
    $('#vel').hidden=true; $('#velPregunta').hidden=true; $('#velAtura').hidden=false;
    pintaAmplia();
  }
}

/* ===================================================================
   16b. esborrar coses amb el dit (MI-GAN)
   Es pinta de vermell el que es vol treure i una xarxa neuronal petita
   (MI-GAN, de Picsart, 25 MB) omple el forat amb el que hi hauria al darrere.
   Fa servir el mateix motor que ampliar, i tampoc no envia res enlloc.
=================================================================== */
function estatTreu(){
  const go=$('#treuGo'); if(!go) return;
  go.disabled=!S.mascara.length || IA.treballant;
  $('#treuNeteja').disabled=!S.mascara.length;
  const info=$('#treuInfo'); if(!info) return;
  const t=IA.treu;
  let h;
  if(t.ultim) h='L\'última, en '+t.ultim.temps+', '+(t.ultim.motor==='gpu'?'amb la gràfica':'amb el processador')+'. Si no t\'agrada, desfés-la.';
  else if(!IA.baixats[t.fitxer]){
    const motor=IA.motor&&!IA.baixats[IA.motors[IA.motor].wasm] ? IA.motors[IA.motor].mb : 0;
    h='La primera vegada es baixa la IA ('+mb(t.mb+motor)+'); després funciona sense connexió.';
  } else h='La IA ja és en aquest aparell.';
  info.textContent=h+' La foto no surt de l\'aparell.';
}
async function preparaSessioTreu(progres){
  const t=IA.treu;
  if(t.sessio) return t.sessio;
  const bytes=await baixaIA(t.fitxer, (a,n)=>progres('la IA',a,n||t.mb*1048576));
  progres('preparant el model',0,0);
  const r=await creaSessio(bytes);
  t.sessio=r.sessio; t.motorReal=r.motorReal; t.errorGPU=r.errorGPU;
  return t.sessio;
}

/* La feina. El model només sap treballar a 512 × 512, així que es retalla un
   tros de la foto al voltant del vermell (2,2 vegades més gran que el forat,
   perquè vegi què hi ha al voltant), es fa de 512, el model l'omple, es torna
   a la mida de debò i només s'enganxa on hi havia vermell, amb la vora
   esvaïda. La resta de la foto no es toca gens: es queda tan nítida com era. */
async function treuAmbIA(src, sessio){
  const N=IA.treu.N, W=src.width, H=src.height;
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for(const m of S.mascara){
    const r=m.size/2;
    for(let i=0;i<m.pts.length;i+=2){
      x0=Math.min(x0,m.pts[i]-r); x1=Math.max(x1,m.pts[i]+r);
      y0=Math.min(y0,m.pts[i+1]-r); y1=Math.max(y1,m.pts[i+1]+r);
    }
  }
  x0=clamp(x0,0,W); x1=clamp(x1,0,W); y0=clamp(y0,0,H); y1=clamp(y1,0,H);
  if(x1-x0<1 || y1-y0<1) return null;
  const L=Math.max(Math.max(x1-x0,y1-y0)*2.2, 160);
  const w=round(Math.min(W,L)), h=round(Math.min(H,L));
  const rx=round(clamp((x0+x1)/2-w/2,0,W-w)), ry=round(clamp((y0+y1)/2-h/2,0,H-h));
  const sx=N/w, sy=N/h;
  // el forat es fa una mica més gros (4 píxels a 512): si no, la vora de
  // l'objecte, que gairebé mai no es pinta del tot, hi quedaria com una aura
  const engreix=2*4/Math.min(sx,sy);

  const ent=mkCanvas(N,N), ex=ent.getContext('2d',{willReadFrequently:true});
  ex.imageSmoothingQuality='high';
  ex.drawImage(src,rx,ry,w,h,0,0,N,N);
  const im=ex.getImageData(0,0,N,N);
  const mc=mkCanvas(N,N), mx=mc.getContext('2d',{willReadFrequently:true});
  mx.setTransform(sx,0,0,sy,-rx*sx,-ry*sy);
  tracaMascara(mx,'#fff',engreix);
  const md=mx.getImageData(0,0,N,N).data, d=im.data;

  // l'entrada: la màscara menys 0,5 (1 = es queda, 0 = s'esborra) i la foto
  // de -1 a 1, amb el forat a zero
  const P=N*N, e=new Float32Array(4*P), forat=new Uint8Array(P);
  for(let i=0,k=0;i<P;i++,k+=4){
    const f=md[k+3]>127 ? 1 : 0, q=1-f;
    forat[i]=f;
    e[i]=q-0.5;
    e[P+i]=(d[k]/127.5-1)*q; e[2*P+i]=(d[k+1]/127.5-1)*q; e[3*P+i]=(d[k+2]/127.5-1)*q;
  }
  const res=await sessio.run({[sessio.inputNames[0]]: new ort.Tensor('float32',e,[1,4,N,N])});
  const sortida=res[sessio.outputNames[0]], y=sortida.data;
  for(let i=0,k=0;i<P;i++,k+=4) if(forat[i]){
    d[k]=(y[i]+1)*127.5; d[k+1]=(y[P+i]+1)*127.5; d[k+2]=(y[2*P+i]+1)*127.5; d[k+3]=255;
  }
  if(sortida.dispose) sortida.dispose();
  ex.putImageData(im,0,0);

  // de tornada a la mida de debò, retallat amb la forma del forat
  const peca=mkCanvas(w,h), px=peca.getContext('2d');
  px.imageSmoothingQuality='high';
  px.drawImage(ent,0,0,w,h);
  const fm=mkCanvas(w,h), fx=fm.getContext('2d');
  if('filter' in fx) fx.filter='blur('+Math.max(1,engreix*0.3).toFixed(1)+'px)';
  fx.translate(-rx,-ry);
  tracaMascara(fx,'#fff',engreix);
  px.globalCompositeOperation='destination-in';
  px.drawImage(fm,0,0);
  const nova=mkCanvas(W,H), nx=nova.getContext('2d');
  nx.drawImage(src,0,0);
  nx.drawImage(peca,rx,ry);
  return nova;
}

async function fesTreu(){
  if(IA.treballant || !baseCanvas || !S.mascara.length) return;
  if(IA.motor==null){ say('Un moment: encara s\'està mirant què pot fer servir aquest aparell.'); return; }
  hideTextEdit();
  IA.treballant=true; IA.atura=false; estatTreu();
  const t0=performance.now();
  mantenEncesa();
  try{
    const progres=(que,a,t)=>{
      if(IA.atura) throw new Error('aturat');
      vel(t ? 'Baixant '+que+'…' : 'Preparant la IA…', t ? a/t : 0, t ? mb(a/1048576)+' de '+mb(t/1048576)+' · només la primera vegada' : 'Només la primera vegada.');
    };
    vel('Preparant…',0,'');
    await preparaMotor(progres);
    const sessio=await preparaSessioTreu(progres);
    if(IA.atura) throw new Error('aturat');
    vel('Esborrant…',1,IA.treu.motorReal==='gpu'?'Amb la gràfica.':'Amb el processador: pot trigar uns segons.');
    const nova=await treuAmbIA(baseCanvas, sessio);
    if(IA.atura) throw new Error('aturat');
    if(!nova){ say('El vermell queda fora de la foto.'); return; }
    // La foto esborrada passa a ser la foto, com quan s'amplia: els girs i el
    // retall ja hi són aplicats. Les pinzellades no es mouen (la mida és la
    // mateixa) i desfer torna a la d'abans.
    S.src=nova; S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
    buildBase(); scheduleRender();
    push('Esborra amb IA');
    const temps=minuts((performance.now()-t0)/1000);
    IA.treu.ultim={ temps, motor:IA.treu.motorReal };
    say('Esborrat en '+temps+'. Si no t\'agrada, desfés-ho; si en queda un tros, torna-hi.');
  }catch(e){
    const msg=String(e&&e.message||e);
    if(msg==='aturat') say('Aturat. La foto és com era.');
    else { say('No s\'ha pogut esborrar: '+msg+'.'); console.warn('Esborra:',e); }
  }finally{
    IA.treballant=false; IA.atura=false;
    try{ if(bloqueigPantalla) await bloqueigPantalla.release(); }catch(e){}
    bloqueigPantalla=null;
    $('#vel').hidden=true;
    estatTreu();
  }
}

let msgTimer=null;
function say(t){
  $('#stMsg').textContent=t;
  clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>{
    if(!baseCanvas) return;
    $('#stMsg').textContent = S.sample
      ? 'Imatge d\'exemple generada per la pàgina. Obre\'n una teva per començar.'

$('#btnUndo').onclick=undo;
$('#btnRedo').onclick=redo;
$('#btnZoomIn').onclick=()=>setZoom(S.zoom*1.25);
$('#btnZoomOut').onclick=()=>setZoom(S.zoom/1.25);
$('#zoomRead').onclick=fitToStage;

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  const k=e.key.toLowerCase();
  if(IA.treballant){ if(k==='escape') IA.atura=true; e.preventDefault(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='s'){ e.preventDefault(); saveDialog(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='o'){ e.preventDefault(); $('#file').click(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const map={v:'move',c:'crop',b:'brush',e:'eraser',s:'clone',x:'treu',t:'text',i:'pick'};
  if(map[k]){ e.preventDefault(); setTool(map[k]); return; }
  if(k==='enter'&&cropOn){ e.preventDefault(); endCrop(true); setTool('move'); return; }
  if(k==='escape' && S.mascara.length){ S.mascara=[]; pintaVista(); estatTreu(); return; }
  if(k==='escape'){ if(cropOn){ endCrop(false); setTool('move'); } hideTextEdit(); return; }
  if(k==='0'){ e.preventDefault(); fitToStage(); return; }
  if(k==='1'){ e.preventDefault(); setZoom(1); return; }
  if(k==='+'||k==='='){ e.preventDefault(); setZoom(S.zoom*1.25); return; }
  if(k==='-'){ e.preventDefault(); setZoom(S.zoom/1.25); return; }
  if(k==='['){ S.brush.size=clamp(round(S.brush.size*0.8),1,400); refreshBrushUI(); return; }
  if(k===']'){ S.brush.size=clamp(round(S.brush.size*1.25)+1,1,400); refreshBrushUI(); return; }
});
function refreshBrushUI(){
  updateCursorSize();
  if(['brush','eraser','clone','treu'].includes(S.tool)) buildOpts(S.tool,TOOLS.find(x=>x.id===S.tool).hint);
  say('Pinzell: '+S.brush.size+' px');
}

let rz=null;
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{ if(Math.abs(S.zoom-S.fitZoom)<0.001) fitToStage(); else applyZoomCss(); },140);
});

   (cambra-fosca-sw.js) només s'ocupa d'aquesta pàgina, no de la portada ni de
   la Revisió. El botó INSTAL·LA només surt quan el navegador diu que es pot
   (al Chrome i l'Edge); a la resta, ho diu l'ajuda. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('cambra-fosca-sw.js',{scope:'./cambra-fosca'}).catch(e=>console.warn('Sense connexió no anirà:',e));
}
let promptInstal=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstal=e; $('#btnInstal').hidden=false; });
$('#btnInstal').onclick=async()=>{
  if(!promptInstal) return;
  promptInstal.prompt();
  const r=await promptInstal.userChoice.catch(()=>({outcome:'dismissed'}));
  promptInstal=null; $('#btnInstal').hidden=true;
  if(r.outcome!=='accepted') say('D\'acord. Si més endavant la vols instal·lar, ho tens al menú del navegador.');
};
addEventListener('appinstalled',()=>{ $('#btnInstal').hidden=true; say('Instal·lada. La trobaràs entre les apps, amb el llum taronja.'); });

})();
