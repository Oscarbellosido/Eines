<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<title>La Cambra Fosca</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Disposicio: barra de dalt, tira d'eines a l'esquerra, el llenc al mig, els
   panells a la dreta i la ratlla d'estat a sota.
   Nomes hi ha tema fosc, i es a posta: els tons d'una imatge es jutgen amb un
   voltant fosc i neutre; amb un fons clar, la mateixa foto sembla mes fosca. */
:root{
  color-scheme: dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#17181a;
  --bg-2:#1e2023;
  --bg-3:#272a2e;
  --bg-4:#32363b;
  --stage:#0d0e0f;
  --line:#34383d;
  --line-soft:#2a2d31;
  --fg:#e8eaed;
  --fg-dim:#9ba2ab;
  --fg-faint:#6f757d;
  --accent:#f0a33c;      /* el vermell-taronja del llum de la cambra fosca */
  --accent-deep:#b9761f;
  --accent-wash:rgba(240,163,60,.14);
  --danger:#e4705f;
  --font-ui:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --rail:56px;
  --panel:272px;
}
html,body{height:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
*{box-sizing:border-box}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- barra de dalt ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;flex:0 0 auto;
  padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--bg-2);border-bottom:1px solid var(--line);
}
.back{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg-3);color:var(--fg-dim);text-decoration:none;
  flex:0 0 auto;font-size:13px;
}
.back:hover{background:var(--bg-4);color:var(--fg)}
.back span{font-size:11px;letter-spacing:.06em}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-weight:600;letter-spacing:-.015em;font-size:14px;white-space:nowrap}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;align-self:center;box-shadow:0 0 10px var(--accent)}
.brand span{color:var(--fg-faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 auto;min-width:0}
.group{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg-3);color:var(--fg);white-space:nowrap;
}
.btn:hover{background:var(--bg-4);border-color:#454a50}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.38;cursor:default;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#231604;font-weight:600}
.btn.primary:hover{background:#ffb44f}
.btn.ghost{background:transparent}
.btn.icon{width:28px;padding:0;justify-content:center}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.zoomread{
  font-family:var(--font-mono);font-size:11px;min-width:52px;text-align:center;color:var(--fg-dim);
  font-variant-numeric:tabular-nums;
}

/* ---------- cos ---------- */
.body{flex:1 1 auto;display:flex;min-height:0;min-width:0}

/* tira d'eines */
.rail{
  flex:0 0 var(--rail);background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;
  padding-left:env(safe-area-inset-left,0px);overflow:auto;
}
.tool{
  position:relative;width:38px;height:38px;border-radius:7px;display:grid;place-items:center;
  color:var(--fg-dim);border:1px solid transparent;
}
.tool svg{width:19px;height:19px}
.tool:hover{background:var(--bg-3);color:var(--fg)}
.tool[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent);border-color:rgba(240,163,60,.4)}
.tool .kbd{
  position:absolute;right:3px;bottom:2px;font-family:var(--font-mono);font-size:8px;color:var(--fg-faint);
}
.tool[aria-pressed="true"] .kbd{color:var(--accent-deep)}
.railsep{width:22px;height:1px;background:var(--line);margin:6px 0}

/* la taula on hi ha la imatge */
.stage{
  flex:1 1 auto;min-width:0;background:var(--stage);position:relative;overflow:auto;
  display:grid;place-items:center;padding:28px;
  background-image:radial-gradient(circle at 50% 0%,rgba(255,255,255,.035),transparent 60%);
}
.stage[data-bg="mid"]{background-color:#4a4d50}
.stage[data-bg="light"]{background-color:#cfd2d5}
.stage.panning{cursor:grabbing}
.wrap{position:relative;flex:0 0 auto;box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07)}
#view{display:block;touch-action:none;image-rendering:auto}
.wrap[data-tool="brush"] #view,.wrap[data-tool="eraser"] #view,.wrap[data-tool="clone"] #view{cursor:none}
.wrap[data-tool="text"] #view{cursor:text}
.wrap[data-tool="pick"] #view{cursor:crosshair}
.wrap[data-tool="move"] #view{cursor:grab}
#cursor{
  position:absolute;border:1px solid #fff;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.75);display:none;z-index:4;
}
#cloneSrc{
  position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;display:none;z-index:4;
}
#cloneSrc::before,#cloneSrc::after{content:"";position:absolute;background:var(--accent);box-shadow:0 0 2px #000}
#cloneSrc::before{left:6px;top:0;width:2px;height:14px}
#cloneSrc::after{top:6px;left:0;height:2px;width:14px}

/* el marc del retall */
#crop{position:absolute;inset:0;display:none;z-index:5}
#crop.on{display:block}
#cropBox{
  position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.58);outline:1px solid rgba(255,255,255,.9);
  cursor:move;
}
#cropBox .g{position:absolute;background:rgba(255,255,255,.3)}
#cropBox .g.v1{left:33.33%;top:0;bottom:0;width:1px}
#cropBox .g.v2{left:66.66%;top:0;bottom:0;width:1px}
#cropBox .g.h1{top:33.33%;left:0;right:0;height:1px}
#cropBox .g.h2{top:66.66%;left:0;right:0;height:1px}
#cropBox .h{position:absolute;width:13px;height:13px;background:#fff;border:1px solid #000;border-radius:2px}
.h.nw{left:-7px;top:-7px;cursor:nwse-resize}
.h.ne{right:-7px;top:-7px;cursor:nesw-resize}
.h.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.h.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.h.n{left:50%;margin-left:-7px;top:-7px;cursor:ns-resize}
.h.s{left:50%;margin-left:-7px;bottom:-7px;cursor:ns-resize}
.h.w{top:50%;margin-top:-7px;left:-7px;cursor:ew-resize}
.h.e{top:50%;margin-top:-7px;right:-7px;cursor:ew-resize}

/* la caixa d'escriure text damunt la imatge */
#textEdit{
  position:absolute;z-index:6;display:none;background:rgba(14,15,16,.9);border:1px solid var(--accent);
  border-radius:6px;padding:4px;min-width:170px;
}
#textEdit input{
  width:100%;background:transparent;border:0;outline:none;font-size:13px;padding:3px 4px;
}
#textEdit .hint{font-size:10px;color:var(--fg-faint);padding:0 4px 2px}

/* ---------- panells de la dreta ---------- */
.panels{
  flex:0 0 var(--panel);background:var(--bg-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  padding-right:env(safe-area-inset-right,0px);
}
.psect{border-bottom:1px solid var(--line);flex:0 0 auto}
.phead{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint);
  font-weight:600;
}
.phead .mini{font-family:var(--font-mono);letter-spacing:0;text-transform:none;font-size:10.5px}
.pbody{padding:2px 12px 12px}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{
  flex:1 1 0;padding:7px 4px;border-radius:6px 6px 0 0;font-size:11.5px;color:var(--fg-dim);
  border:1px solid transparent;border-bottom:0;margin-bottom:-1px;
}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);border-color:var(--line);font-weight:600}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;min-height:0;background:var(--bg)}
.pane{display:none;padding:10px 12px 20px}
.pane.on{display:block}

/* controls lliscants */
.grp{margin:0 0 14px}
.grp>h4{
  margin:0 0 7px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint);
  font-weight:600;display:flex;align-items:center;gap:7px;
}
.grp>h4::after{content:"";flex:1 1 auto;height:1px;background:var(--line-soft)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin-bottom:7px}
.row label{font-size:12px;color:var(--fg-dim);cursor:pointer;user-select:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row label:hover{color:var(--fg)}
.row .val{
  font-family:var(--font-mono);font-size:11px;color:var(--fg);font-variant-numeric:tabular-nums;
  min-width:36px;text-align:right;
}
.row .val.zero{color:var(--fg-faint)}
.row input[type=range]{grid-column:1/-1;width:100%;margin:0}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:16px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--bg-4)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);
  border:0;margin-top:-4.5px;box-shadow:0 1px 3px rgba(0,0,0,.6);
}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--bg-4)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}
input[type=range].touched::-webkit-slider-thumb{background:var(--accent)}
input[type=range].touched::-moz-range-thumb{background:var(--accent)}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px;font-size:12px;color:var(--fg-dim)}
.sw{
  position:relative;width:34px;height:18px;border-radius:9px;background:var(--bg-4);flex:0 0 auto;
  transition:background .15s;border:1px solid var(--line);
}
.sw::after{
  content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--fg-dim);
  transition:transform .15s,background .15s;
}
.sw[aria-pressed="true"]{background:var(--accent-wash);border-color:rgba(240,163,60,.5)}
.sw[aria-pressed="true"]::after{transform:translateX(16px);background:var(--accent)}

/* filtres */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{
  display:flex;flex-direction:column;gap:5px;align-items:stretch;border-radius:7px;padding:0;
  border:1px solid transparent;
}
.fcard canvas{
  width:100%;aspect-ratio:1;max-width:100%;display:block;border-radius:6px;background:var(--bg-3);
  border:1px solid var(--line);
}
.fcard span{font-size:10.5px;color:var(--fg-dim);text-align:center;line-height:1.25}
.fcard:hover canvas{border-color:#5a6066}
.fcard[aria-pressed="true"] canvas{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fcard[aria-pressed="true"] span{color:var(--accent)}

/* historial */
.hlist{display:flex;flex-direction:column;gap:1px}
.hitem{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;text-align:left;
  font-size:12px;color:var(--fg-dim);width:100%;
}
.hitem:hover{background:var(--bg-3);color:var(--fg)}
.hitem[aria-current="true"]{background:var(--accent-wash);color:var(--accent)}
.hitem.future{opacity:.4}
.hitem .n{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);width:16px;text-align:right;flex:0 0 auto}
.hitem[aria-current="true"] .n{color:var(--accent-deep)}

/* opcions de l'eina */
.opts{display:flex;flex-direction:column;gap:8px}
.optrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{
  padding:4px 8px;border-radius:5px;border:1px solid var(--line);background:var(--bg-3);
  font-size:11px;color:var(--fg-dim);font-family:var(--font-mono);
}
.chip:hover{color:var(--fg);border-color:#4a4f55}
.chip[aria-pressed="true"]{background:var(--accent-wash);border-color:rgba(240,163,60,.5);color:var(--accent)}
.swatch{
  width:28px;height:28px;border-radius:6px;border:1px solid var(--line);padding:0;overflow:hidden;
  flex:0 0 auto;cursor:pointer;background:none;
}
.swatch input{width:200%;height:200%;margin:-25% 0 0 -25%;border:0;padding:0;background:none;cursor:pointer}
.tiny{font-size:11px;color:var(--fg-faint);line-height:1.45}
select{
  height:26px;border-radius:5px;border:1px solid var(--line);background:var(--bg-3);padding:0 6px;
  font-size:11.5px;min-width:0;
}
.note{
  display:flex;gap:7px;align-items:flex-start;padding:8px 9px;border-radius:6px;
  background:var(--accent-wash);border:1px solid rgba(240,163,60,.28);font-size:11px;color:#f4c789;line-height:1.45;
}
.note svg{width:13px;height:13px;flex:0 0 auto;margin-top:1px}

/* arregla la foto */
.arregla #arregla{width:100%;height:36px;justify-content:center;font-size:13px;margin-bottom:7px}
.arregla #arreglaRes{color:var(--fg);margin-bottom:6px;padding:7px 9px;border-radius:6px;background:var(--accent-wash);border:1px solid rgba(240,163,60,.28)}
.arregla>.tiny{margin-bottom:8px}
.arregla #arreglaRes{margin-bottom:10px}
.arregla .optrow{margin:-2px 0 4px}
.arregla .optrow .tiny{flex:1 1 140px;min-width:0}
#reixa{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background-image:
    linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);
  background-size:33.333% 33.333%,33.333% 33.333%,8.333% 8.333%,8.333% 8.333%;
  background-position:-1px -1px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);
}

/* ampliar amb IA */
.modes{display:flex;flex-direction:column;gap:8px}
.mode{
  display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 11px;border-radius:8px;width:100%;
  border:1px solid var(--line);background:var(--bg-2);
}
.mode b{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mode b em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint);font-weight:400}
.mode span{font-size:11.5px;color:var(--fg-dim);line-height:1.4}
.mode:hover{border-color:#4a4f55}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash)}
.mode[aria-pressed="true"] b{color:var(--accent)}
.ia-linies{display:flex;flex-direction:column;gap:6px;margin:2px 0 12px}
.ia-res{font-family:var(--font-mono);font-size:11.5px;color:var(--fg);margin-top:7px}
.ia-mal{color:var(--danger)}
.ia-avis{color:#f4c789}
#iaGo{width:100%;height:38px;justify-content:center;font-size:13px}
.barra-ia{height:6px;border-radius:3px;background:var(--bg-4);overflow:hidden;margin:9px 0 6px}
.barra-ia i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#vel{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(13,14,15,.6);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
#vel>div{
  width:min(320px,100%);background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
#vel b{font-size:13px;font-weight:600}
#vel .tiny{min-height:1.45em}
#velAtura{margin-top:10px}

/* ---------- ratlla d'estat ---------- */
.statusbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;height:26px;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--bg-2);border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint);
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;
}
.statusbar .sep{width:1px;height:12px;background:var(--line)}
.statusbar .flex{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;font-family:var(--font-ui);font-size:11px}
.busy{color:var(--accent)}

/* ---------- quadres de dialeg ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-left,0px));
}
.dlg{
  width:min(420px,100%);background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;
}
.dlg header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dlg header h3{margin:0;font-size:13.5px;font-weight:600}
.dlg .content{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.dlg footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:11px;color:var(--fg-dim)}
.field input[type=text]{
  height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg-3);padding:0 8px;
  font-family:var(--font-mono);font-size:12px;
}
.kbdlist{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:11.5px;color:var(--fg-dim)}
.kbdlist b{font-family:var(--font-mono);color:var(--fg);font-weight:500;white-space:nowrap}

/* on es deixa anar el fitxer */
#drop{
  position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;
  background:rgba(240,163,60,.08);display:none;place-items:center;z-index:20;pointer-events:none;
  color:var(--accent);font-weight:600;
}
#drop.on{display:grid}

/* ---------- pantalles estretes ---------- */
@media (max-width:760px){
  :root{--panel:100%}
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .body{flex-direction:column}
  .rail{
    flex:0 0 auto;flex-direction:row;justify-content:flex-start;border-right:0;border-bottom:1px solid var(--line);
    padding:6px max(10px,env(safe-area-inset-left,0px));gap:3px;
  }
  .railsep{width:1px;height:22px;margin:0 4px;align-self:center}
  .stage{min-height:46vh;padding:14px}
  .panels{flex:0 0 auto;border-left:0;border-top:1px solid var(--line)}
  .scroll{overflow:visible}
  .pane{padding-bottom:12px}
  .brand span{display:none}
  .brand b{font-size:13px}
  /* A 320 px no hi ha manera que tot càpiga en una filera: la barra es parteix
     en dues. A dalt, tornar · el nom · DESA; a sota, obrir, desfer i el zoom.
     Les dreceres de teclat no serveixen de res amb el dit, i el botó marxa. */
  .topbar{gap:8px;flex-wrap:wrap;row-gap:6px}
  .brand{flex:1 1 auto}
  .g-main{order:0}

<script>
"use strict";
(function(){

/* ===================================================================
   0. ajudes
=================================================================== */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const round = Math.round;
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,round(w)); c.height=Math.max(1,round(h)); return c; }

/* ===================================================================
   1. els ajustos i els filtres
=================================================================== */
const ADJ_DEF = {
  exposure:0, brightness:0, contrast:0, highlights:0, shadows:0,
  temperature:0, tint:0, saturation:0, vibrance:0, hue:0,
  clarity:0, sharpen:0, blur:0,
  vignette:0, grain:0, sepia:0, mono:false
};
const ADJ_SPEC = [
  { group:'Llum', items:[
    { k:'exposure',   label:'Exposició' },
    { k:'contrast',   label:'Contrast' },
    { k:'highlights', label:'Llums altes' },
    { k:'shadows',    label:'Ombres' },
    { k:'brightness', label:'Brillantor' },
  ]},
  { group:'Color', items:[
    { k:'temperature', label:'Temperatura' },
    { k:'tint',        label:'Matís' },
    { k:'saturation',  label:'Saturació' },
    { k:'vibrance',    label:'Intensitat' },
    { k:'hue',         label:'Gir de to', min:-180, max:180, unit:'°' },
  ]},
  { group:'Detall', items:[
    { k:'clarity', label:'Claredat' },
    { k:'sharpen', label:'Nitidesa', min:0 },
    { k:'blur',    label:'Difuminat', min:0 },
  ]},
  { group:'Efectes', items:[
    { k:'vignette', label:'Vinyeta' },
    { k:'grain',    label:'Gra', min:0 },
    { k:'sepia',    label:'Tonalitat sèpia', min:0 },
  ]},
];
const PRESETS = [
  { id:'cap',     name:'Original',    adj:{} },
  { id:'bn',      name:'Blanc i negre', adj:{ mono:true, contrast:14, clarity:16 } },
  { id:'sepia',   name:'Sèpia',       adj:{ mono:true, sepia:72, contrast:8, exposure:5 } },
  { id:'cinema',  name:'Cinema',      adj:{ contrast:18, shadows:20, highlights:-14, temperature:-14, saturation:-12, vignette:26, clarity:10 } },
  { id:'calid',   name:'Càlid',       adj:{ temperature:24, exposure:6, saturation:8, vibrance:14 } },
  { id:'fred',    name:'Fred',        adj:{ temperature:-24, tint:-6, saturation:-4, clarity:9 } },
  { id:'vivid',   name:'Vívid',       adj:{ saturation:22, vibrance:28, contrast:14, clarity:12 } },
  { id:'esvait',  name:'Esvaït',      adj:{ contrast:-18, shadows:30, highlights:-10, saturation:-16, exposure:7, grain:14 } },
  { id:'retrat',  name:'Retrat',      adj:{ clarity:-12, exposure:5, shadows:14, temperature:9, saturation:6, sharpen:18 } },
  { id:'nocturn', name:'Nocturn',     adj:{ exposure:-9, contrast:22, shadows:-14, temperature:-10, vignette:36, grain:20 } },
];

/* ===================================================================
   2. l'estat
=================================================================== */
const S = {
  src:null,               // HTMLCanvasElement with the untouched, un-oriented image
  name:'exemple.png',
  sample:true,
  rot:0, flipH:false, flipV:false,
  crop:null,              // {x,y,w,h} in oriented-source coords
  adj:Object.assign({},ADJ_DEF),
  ops:[],                 // paint operations, coords in base space
  preset:'cap',
  tool:'move',
  zoom:1, fitZoom:1,
  brush:{ size:46, hardness:60, opacity:85, color:'#f0a33c' },
  text:{ size:64, font:'sans', bold:false },
  cloneSrc:null,
  history:[], hIndex:-1,
  stageBg:'dark',
};

let baseCanvas=null, baseCtx=null;     // oriented + cropped original pixels, full res
let paintCanvas=null, paintCtx=null;   // paint layer, same size as base
let scratch=null, scratchCtx=null;     // per-stroke scratch
let workCanvas=null, workCtx=null;     // composite buffer at render scale
const view=$('#view'), vctx=view.getContext('2d',{willReadFrequently:false});
let renderScale=1, downloads=null, pendingRender=false;

/* ===================================================================
   3. la imatge d'exemple
   No es cap fotografia: es pinta sola, sempre igual (la llavor es fixa), i te
   cel, muntanyes, aigua i gra perque tots els ajustos s'hi notin.
=================================================================== */
function makeSample(){
  const W=1500,H=1000, c=mkCanvas(W,H), x=c.getContext('2d');
  let seed=20261111;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };

  const hz=H*0.56;
  let g=x.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,'#12213d'); g.addColorStop(.42,'#3f5a78');
  g.addColorStop(.74,'#b98559'); g.addColorStop(1,'#f0c489');
  x.fillStyle=g; x.fillRect(0,0,W,hz);

  const sx=W*0.68, sy=hz*0.80;
  g=x.createRadialGradient(sx,sy,0,sx,sy,330);
  g.addColorStop(0,'rgba(255,241,205,.95)'); g.addColorStop(.18,'rgba(255,214,150,.55)');
  g.addColorStop(1,'rgba(255,190,120,0)');
  x.fillStyle=g; x.beginPath(); x.arc(sx,sy,330,0,7); x.fill();
  x.fillStyle='#fff6e0'; x.beginPath(); x.arc(sx,sy,34,0,7); x.fill();

  // nuvols
  x.save(); x.globalCompositeOperation='lighter';
  for(let i=0;i<26;i++){
    const cx=rnd()*W, cy=hz*0.12+rnd()*hz*0.5, rw=70+rnd()*230, rh=rw*(0.12+rnd()*0.14);
    const a=0.05+rnd()*0.11;
    g=x.createRadialGradient(cx,cy,0,cx,cy,rw);
    g.addColorStop(0,'rgba(255,226,196,'+a+')'); g.addColorStop(1,'rgba(255,226,196,0)');
    x.fillStyle=g; x.save(); x.translate(cx,cy); x.scale(1,rh/rw);
    x.beginPath(); x.arc(0,0,rw,0,7); x.fill(); x.restore();
  }
  x.restore();

  // serralades, de la mes llunyana a la mes propera
  const ridges=[
    { base:hz*0.995, amp:120, col:'#6d7d93', freq:0.0034, haze:0.58, peak:0.75 },
    { base:hz*1.00,  amp:196, col:'#495972', freq:0.0024, haze:0.34, peak:0.86 },
    { base:hz*1.005, amp:286, col:'#2b3546', freq:0.0016, haze:0.10, peak:1.00 },
  ];
  for(const r of ridges){
    x.beginPath(); x.moveTo(0,hz+2);
    const p1=rnd()*100,p2=rnd()*100,p3=rnd()*100,p4=rnd()*100;
    for(let px=0;px<=W;px+=3){
      // amb sinus en valor absolut la carena fa cims i colls de debo; amb sinus
      // normals sortia una sola llomada suau
      const ridge =
          Math.abs(Math.sin(px*r.freq+p1))*0.62
        + Math.abs(Math.sin(px*r.freq*2.07+p2))*0.26
        + Math.sin(px*r.freq*4.9+p3)*0.09
        + Math.sin(px*r.freq*11.3+p4)*0.035;
      const y=r.base - Math.pow(ridge,1.35)*r.amp*r.peak - r.amp*0.16;
      x.lineTo(px,y);
    }
    x.lineTo(W,hz+2); x.closePath();
    x.fillStyle=r.col; x.fill();
    x.save(); x.globalCompositeOperation='source-atop';
    g=x.createLinearGradient(0,hz-r.amp*1.6,0,hz);
    g.addColorStop(0,'rgba(240,200,160,0)'); g.addColorStop(1,'rgba(240,200,160,'+r.haze+')');
    x.fillStyle=g; x.fillRect(0,0,W,hz+4); x.restore();
  }

  // l'aigua
  g=x.createLinearGradient(0,hz,0,H);
  g.addColorStop(0,'#caa07a'); g.addColorStop(.22,'#6d7f94'); g.addColorStop(1,'#1d2735');
  x.fillStyle=g; x.fillRect(0,hz,W,H-hz);
  x.save(); x.globalAlpha=.30;
  x.translate(0,hz*2); x.scale(1,-1);
  x.drawImage(c,0,0,W,hz,0,0,W,hz);
  x.restore();
  // la reverberacio del sol i les ones
  x.save();
  for(let i=0;i<190;i++){
    const ry=hz+Math.pow(rnd(),1.7)*(H-hz);
    const spread=40+(ry-hz)*1.5;
    const rx=sx+(rnd()-0.5)*spread*2;
    const w=8+rnd()*54, h=1+rnd()*2.1;
    x.fillStyle='rgba(255,236,196,'+(0.06+rnd()*0.28)+')';
    x.fillRect(rx-w/2,ry,w,h);
  }
  for(let i=0;i<130;i++){
    const ry=hz+Math.pow(rnd(),1.4)*(H-hz);
    x.fillStyle='rgba(255,255,255,'+(0.015+rnd()*0.05)+')';
    x.fillRect(rnd()*W-60,ry,40+rnd()*170,1);
  }
  x.restore();

  // la riba del davant
  x.beginPath(); x.moveTo(0,H);
  for(let px=0;px<=W;px+=6){
    const y=H-28-Math.sin(px*0.0042+1.2)*22-Math.sin(px*0.013+0.4)*9;
    x.lineTo(px,y);
  }
  x.lineTo(W,H); x.closePath(); x.fillStyle='#121a24'; x.fill();

  // gra i cantonades mes fosques, perque l'exemple es comporti com una foto
  const id=x.getImageData(0,0,W,H), d=id.data;
  for(let p=0,i=0;i<d.length;i+=4,p++){
    const n=(rnd()-0.5)*7;
    const px=p%W, py=(p-px)/W;
    const nx=(px/W-0.5)*2, ny=(py/H-0.5)*2;
    const v=1-0.17*Math.pow(Math.min(1,Math.sqrt(nx*nx+ny*ny)/1.3),2.4);
    d[i]=(d[i]+n)*v; d[i+1]=(d[i+1]+n)*v; d[i+2]=(d[i+2]+n)*v;
  }
  x.putImageData(id,0,0);
  return c;
}

/* ===================================================================
   4. geometria: girs, inversions i retall  ->  baseCanvas
=================================================================== */
function orientedSize(){
  const w=S.src.width, h=S.src.height;
  return (S.rot%180) ? {w:h,h:w} : {w,h};
}
function buildBase(){
  // Sense girs, inversions ni retall, la base és la foto mateixa: no se'n fa
  // cap còpia. Cap llenç no hi dibuixa a sobre, i amb una foto ampliada a
  // 6000 px una còpia són 144 MB més.
  if(!S.rot && !S.flipH && !S.flipV && !S.crop){
    baseCanvas=S.src; baseCtx=null;
    renderPaint();
    return;
  }
  const o=orientedSize();
  const oc=mkCanvas(o.w,o.h), ox=oc.getContext('2d');
  ox.save();
  ox.translate(o.w/2,o.h/2);
  ox.rotate(S.rot*Math.PI/180);
  ox.scale(S.flipH?-1:1, S.flipV?-1:1);
  ox.drawImage(S.src,-S.src.width/2,-S.src.height/2);
  ox.restore();

  let out=oc;
  if(S.crop){
    const c=S.crop;
    out=mkCanvas(c.w,c.h);
    out.getContext('2d').drawImage(oc,c.x,c.y,c.w,c.h,0,0,c.w,c.h);
  }
  baseCanvas=out; baseCtx=null;
  renderPaint();
}
/* La capa de pintura i l'esborrany de cada pinzellada fan la mida de la foto,
   però només calen si s'hi ha pintat alguna cosa: es fan quan calen i es
   llencen quan no hi ha res pintat. */
function ensurePaint(){
  if(!paintCanvas || paintCanvas.width!==baseCanvas.width || paintCanvas.height!==baseCanvas.height){
    paintCanvas=mkCanvas(baseCanvas.width,baseCanvas.height);
    paintCtx=paintCanvas.getContext('2d');
  }
}
function ensureScratch(){
  if(!scratch || scratch.width!==baseCanvas.width || scratch.height!==baseCanvas.height){
    scratch=mkCanvas(baseCanvas.width,baseCanvas.height);
    scratchCtx=scratch.getContext('2d');
  }
}

/* Quan la imatge gira, s'inverteix o es retalla, les pinzellades ja fetes
   s'han de moure igual: aqui es canvien totes les coordenades guardades. */
function mapOps(fn){
  for(const op of S.ops){
    for(let i=0;i<op.pts.length;i+=2){
      const p=fn(op.pts[i],op.pts[i+1]);
      op.pts[i]=p[0]; op.pts[i+1]=p[1];
    }
    if(op.src){ op.src=fn(op.src[0],op.src[1]); }
  }
}
function rotate(dir){
  if(!S.src) return;
  const bw=baseCanvas.width, bh=baseCanvas.height;
  const o=orientedSize();
  if(S.crop){
    const c=S.crop;
    S.crop = dir>0
      ? { x:o.h-(c.y+c.h), y:c.x,              w:c.h, h:c.w }
      : { x:c.y,           y:o.w-(c.x+c.w),    w:c.h, h:c.w };
  }
  mapOps(dir>0 ? (x,y)=>[bh-y,x] : (x,y)=>[y,bw-x]);
  S.rot=(S.rot + (dir>0?90:270))%360;
  buildBase(); fitToStage(); push(dir>0?'Gira 90° a la dreta':'Gira 90° a l\'esquerra');
}
function flip(axis){
  if(!S.src) return;
  const bw=baseCanvas.width, bh=baseCanvas.height;
  const o=orientedSize();
  const horiz = axis==='h';
  if(S.crop){
    const c=S.crop;
    if(horiz) S.crop={x:o.w-(c.x+c.w),y:c.y,w:c.w,h:c.h};
    else      S.crop={x:c.x,y:o.h-(c.y+c.h),w:c.w,h:c.h};
  }
  mapOps(horiz ? (x,y)=>[bw-x,y] : (x,y)=>[x,bh-y]);
  // amb la imatge de costat, invertir-la horitzontalment a la pantalla vol dir
  // invertir-la verticalment a l'original
  if((S.rot%180)===0) horiz ? S.flipH=!S.flipH : S.flipV=!S.flipV;
  else                horiz ? S.flipV=!S.flipV : S.flipH=!S.flipH;
  buildBase(); scheduleRender(); push(horiz?'Inverteix horitzontalment':'Inverteix verticalment');
}

/* ===================================================================
   5. la capa de pintura
   No es guarda cap imatge: es guarda la llista de pinzellades i es tornen a
   pintar. Aixi desfer no gasta memoria, per gran que sigui la foto.
=================================================================== */
function stamp(ctx,x0,y0,x1,y1,size,hardness){
  const r=Math.max(0.5,size/2);
  const step=Math.max(1,r*0.22);
  const dx=x1-x0, dy=y1-y0, dist=Math.hypot(dx,dy);
  const n=Math.max(1,Math.ceil(dist/step));
  const hard=clamp(hardness/100,0,1);
  for(let i=0;i<=n;i++){
    const t=n?i/n:0, x=x0+dx*t, y=y0+dy*t;
    if(hard>=0.995){
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    } else {
      const g=ctx.createRadialGradient(x,y,r*hard*0.92,x,y,r);
      const col=ctx.fillStyle;
      g.addColorStop(0,col);
      g.addColorStop(1,'rgba(0,0,0,0)');
      const keep=ctx.fillStyle;
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      ctx.fillStyle=keep;
    }
  }
}
function drawOp(op){
  if(op.type==='text'){
    paintCtx.save();
    paintCtx.fillStyle=op.color;
    paintCtx.textBaseline='alphabetic';
    paintCtx.font=(op.bold?'600 ':'400 ')+op.size+'px '+fontStack(op.font);
    paintCtx.globalAlpha=1;
    paintCtx.fillText(op.text,op.pts[0],op.pts[1]);
    paintCtx.restore();
    return;
  }
  if(op.type==='erase'){
    paintCtx.save();
    paintCtx.globalCompositeOperation='destination-out';
    paintCtx.fillStyle='rgba(0,0,0,1)';
    for(let i=2;i<op.pts.length;i+=2)
      stamp(paintCtx,op.pts[i-2],op.pts[i-1],op.pts[i],op.pts[i+1],op.size,op.hardness);
    if(op.pts.length===2) stamp(paintCtx,op.pts[0],op.pts[1],op.pts[0],op.pts[1],op.size,op.hardness);
    paintCtx.restore();
    return;
  }
  // el pinzell i el tampo passen per un llenc a part: aixi una pinzellada te
  // una sola opacitat i no se'n va enfosquint alla on es creua ella mateixa
  ensureScratch();
  scratchCtx.clearRect(0,0,scratch.width,scratch.height);
  if(op.type==='clone'){
    const ox=op.src[0]-op.pts[0], oy=op.src[1]-op.pts[1];
    scratchCtx.save();
    scratchCtx.fillStyle='#000';
    for(let i=2;i<op.pts.length;i+=2)
      stamp(scratchCtx,op.pts[i-2],op.pts[i-1],op.pts[i],op.pts[i+1],op.size,op.hardness);
    if(op.pts.length===2) stamp(scratchCtx,op.pts[0],op.pts[1],op.pts[0],op.pts[1],op.size,op.hardness);
    scratchCtx.globalCompositeOperation='source-in';
    scratchCtx.drawImage(baseCanvas,ox,oy);
    scratchCtx.restore();
  } else {
    scratchCtx.fillStyle=op.color;
    for(let i=2;i<op.pts.length;i+=2)
      stamp(scratchCtx,op.pts[i-2],op.pts[i-1],op.pts[i],op.pts[i+1],op.size,op.hardness);
    if(op.pts.length===2) stamp(scratchCtx,op.pts[0],op.pts[1],op.pts[0],op.pts[1],op.size,op.hardness);
  }
  paintCtx.save();
  paintCtx.globalAlpha=clamp(op.opacity/100,0,1);
  paintCtx.drawImage(scratch,0,0);
  paintCtx.restore();
}
function renderPaint(){
  if(!baseCanvas) return;
  if(!S.ops.length){
    paintCanvas=paintCtx=scratch=scratchCtx=paintSnap=paintSnapCtx=null;
    return;
  }
  ensurePaint();
  paintCtx.clearRect(0,0,paintCanvas.width,paintCanvas.height);
  for(const op of S.ops) drawOp(op);
}
function fontStack(f){
  if(f==='mono') return "'IBM Plex Mono',ui-monospace,monospace";
  if(f==='serif') return "Georgia,'Times New Roman',serif";
  return "'IBM Plex Sans',system-ui,sans-serif";
}

/* ===================================================================
   6. el tractament dels pixels
=================================================================== */
const NOISE=(function(){ const n=new Float32Array(65536); let s=7;
  for(let i=0;i<65536;i++){ s=(s*1103515245+12345)>>>0; n[i]=(s/4294967296)-0.5; } return n; })();

function hBlur(src,dst,w,h,r){
  const win=r*2+1, inv=1/win;
  for(let y=0;y<h;y++){
    const o=y*w*4;
    let a=0,b=0,c=0,e=0;
    for(let i=-r;i<=r;i++){ const k=o+clamp(i,0,w-1)*4; a+=src[k];b+=src[k+1];c+=src[k+2];e+=src[k+3]; }
    for(let x=0;x<w;x++){
      const k=o+x*4;
      dst[k]=a*inv; dst[k+1]=b*inv; dst[k+2]=c*inv; dst[k+3]=e*inv;
      const ka=o+clamp(x+r+1,0,w-1)*4, ks=o+clamp(x-r,0,w-1)*4;
      a+=src[ka]-src[ks]; b+=src[ka+1]-src[ks+1]; c+=src[ka+2]-src[ks+2]; e+=src[ka+3]-src[ks+3];
    }
  }
}
function vBlur(src,dst,w,h,r){
  const win=r*2+1, inv=1/win, st=w*4;
  for(let x=0;x<w;x++){
    const o=x*4;
    let a=0,b=0,c=0,e=0;
    for(let i=-r;i<=r;i++){ const k=o+clamp(i,0,h-1)*st; a+=src[k];b+=src[k+1];c+=src[k+2];e+=src[k+3]; }
    for(let y=0;y<h;y++){
      const k=o+y*st;
      dst[k]=a*inv; dst[k+1]=b*inv; dst[k+2]=c*inv; dst[k+3]=e*inv;
      const ka=o+clamp(y+r+1,0,h-1)*st, ks=o+clamp(y-r,0,h-1)*st;
      a+=src[ka]-src[ks]; b+=src[ka+1]-src[ks+1]; c+=src[ka+2]-src[ks+2]; e+=src[ka+3]-src[ks+3];
    }
  }
}
function boxBlur(d,w,h,r,passes){
  r=round(r); if(r<1) return;
  const tmp=new Uint8ClampedArray(d.length);
  for(let p=0;p<(passes||3);p++){ hBlur(d,tmp,w,h,r); vBlur(tmp,d,w,h,r); }
}
function unsharp(d,w,h,radius,amount){
  if(radius<1||!amount) return;
  const b=new Uint8ClampedArray(d);
  boxBlur(b,w,h,radius,2);
  for(let i=0;i<d.length;i+=4){
    d[i]  =d[i]  +amount*(d[i]  -b[i]);
    d[i+1]=d[i+1]+amount*(d[i+1]-b[i+1]);
    d[i+2]=d[i+2]+amount*(d[i+2]-b[i+2]);
  }
}
function hueMatrix(deg){
  const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  return [
    0.213+c*0.787-s*0.213, 0.715-c*0.715-s*0.715, 0.072-c*0.072+s*0.928,
    0.213-c*0.213+s*0.143, 0.715+c*0.285+s*0.140, 0.072-c*0.072-s*0.283,
    0.213-c*0.213-s*0.787, 0.715-c*0.715+s*0.715, 0.072+c*0.928+s*0.072
  ];
}
function pipeline(ctx,w,h,a,scale){
  const needSpatial = a.blur>0 || a.sharpen>0 || a.clarity!==0;
  const needTone = a.exposure||a.brightness||a.contrast||a.temperature||a.tint||
                   a.highlights||a.shadows||a.saturation||a.vibrance||a.hue||
                   a.mono||a.sepia||a.vignette||a.grain;
  if(!needSpatial && !needTone) return;

  const id=ctx.getImageData(0,0,w,h), d=id.data;

  if(a.blur>0) boxBlur(d,w,h,Math.max(1,a.blur/100*26*scale),3);
  if(a.clarity!==0) unsharp(d,w,h,Math.max(2,round(Math.min(w,h)/26)),a.clarity/100*0.85);
  if(a.sharpen>0)  unsharp(d,w,h,Math.max(1,round(1.2*scale)),a.sharpen/100*1.5);

  if(needTone){
    // una taula per canal: exposicio -> temperatura -> contrast -> brillantor.
    // Fent-ho amb una taula de 256 valors, el cost no depen de la mida de la foto.
    const expo=Math.pow(2,a.exposure/60);
    const t=a.temperature/100, ti=a.tint/100;
    const mR=1+t*0.30+ti*0.08, mG=1-ti*0.20, mB=1-t*0.30+ti*0.08;
    const ct=a.contrast/100, cf=ct>=0?1+ct*1.25:1+ct*0.92;
    const br=a.brightness/100*0.32;
    const L=[new Float32Array(256),new Float32Array(256),new Float32Array(256)];
    const mul=[mR,mG,mB];
    for(let ch=0;ch<3;ch++){
      for(let i=0;i<256;i++){
        let v=(i/255)*expo*mul[ch];
        v=(v-0.5)*cf+0.5+br;
        L[ch][i]=clamp(v,0,1)*255;
      }
    }
    const hl=a.highlights/100*0.55, sh=a.shadows/100*0.62;
    const sat=1+a.saturation/100, vib=a.vibrance/100;
    const hm=a.hue?hueMatrix(a.hue):null;
    const mono=!!a.mono, sep=a.sepia/100;
    const vg=a.vignette/100, grain=a.grain/100*46;
    let vx=null,vy=null;
    if(vg){
      vx=new Float32Array(w); vy=new Float32Array(h);
      for(let x=0;x<w;x++){ const n=(x/(w-1||1)-0.5)*2; vx[x]=n*n; }
      for(let y=0;y<h;y++){ const n=(y/(h-1||1)-0.5)*2; vy[y]=n*n; }
    }
    let i=0;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++,i+=4){
        let r=L[0][d[i]], g=L[1][d[i+1]], b=L[2][d[i+2]];

        if(hl||sh){
          const lum=(0.299*r+0.587*g+0.114*b)/255;
          if(hl){ const f=hl*lum*lum*255; r+=f; g+=f; b+=f; }
          if(sh){ const o=1-lum, f=sh*o*o*255; r+=f; g+=f; b+=f; }
        }
        if(hm){
          const nr=hm[0]*r+hm[1]*g+hm[2]*b;
          const ng=hm[3]*r+hm[4]*g+hm[5]*b;
          const nb=hm[6]*r+hm[7]*g+hm[8]*b;
          r=nr; g=ng; b=nb;
        }
        if(vib){
          const mx=r>g?(r>b?r:b):(g>b?g:b);
          const mn=r<g?(r<b?r:b):(g<b?g:b);
          const s2=1+vib*(1-(mx-mn)/255);
          const lum=0.299*r+0.587*g+0.114*b;
          r=lum+(r-lum)*s2; g=lum+(g-lum)*s2; b=lum+(b-lum)*s2;
        }
        if(mono){
          const lum=0.2126*r+0.7152*g+0.0722*b;
          r=g=b=lum;
        } else if(sat!==1){
          const lum=0.299*r+0.587*g+0.114*b;
          r=lum+(r-lum)*sat; g=lum+(g-lum)*sat; b=lum+(b-lum)*sat;
        }
        if(sep){
          const lum=0.2126*r+0.7152*g+0.0722*b;
          r=r+(lum*1.07-r)*sep; g=g+(lum*0.90-g)*sep; b=b+(lum*0.68-b)*sep;
        }
        if(vg){
          const dd=Math.sqrt(vx[x]+vy[y])/1.414;
          const f=1-vg*Math.pow(dd,2.1);
          r*=f; g*=f; b*=f;
        }
        if(grain){
          const n=NOISE[(i>>2)&65535]*grain;
          r+=n; g+=n; b+=n;
        }
        d[i]=r; d[i+1]=g; d[i+2]=b;
      }
    }
  }
  ctx.putImageData(id,0,0);
}

/* ===================================================================
   7. pintar la pantalla
=================================================================== */
function composite(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(baseCanvas,0,0,w,h);
  if(paintCanvas) ctx.drawImage(paintCanvas,0,0,w,h);
}
function renderInto(canvas,w,h,adj){
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  composite(ctx,w,h);
  pipeline(ctx,w,h,adj,w/baseCanvas.width);
  return ctx;
}
function scheduleRender(){
  if(pendingRender) return;
  pendingRender=true;
  requestAnimationFrame(()=>{ pendingRender=false; render(); });
}
function render(){
  if(!baseCanvas) return;
  const bw=baseCanvas.width, bh=baseCanvas.height;
  const budget=1600*Math.max(1,Math.min(2,S.zoom));
  renderScale=clamp(budget/Math.max(bw,bh),0.04,1);
  const w=Math.max(1,round(bw*renderScale)), h=Math.max(1,round(bh*renderScale));
  if(!workCanvas){ workCanvas=mkCanvas(w,h); workCtx=workCanvas.getContext('2d',{willReadFrequently:true}); }
  if(workCanvas.width!==w||workCanvas.height!==h){ workCanvas.width=w; workCanvas.height=h; }
  const t0=performance.now();
  composite(workCtx,w,h);
  pipeline(workCtx,w,h,S.adj,renderScale);
  if(view.width!==w||view.height!==h){ view.width=w; view.height=h; }
  vctx.clearRect(0,0,w,h);
  vctx.drawImage(workCanvas,0,0);
  applyZoomCss();
  $('#stDims').textContent=bw+' × '+bh+' px';
  const ms=performance.now()-t0;
  $('#stPos').dataset.ms=ms.toFixed(0);
}
function applyZoomCss(){
  if(!baseCanvas) return;
  const w=baseCanvas.width*S.zoom, h=baseCanvas.height*S.zoom;
  view.style.width=w+'px'; view.style.height=h+'px';
  $('#wrap').style.width=w+'px'; $('#wrap').style.height=h+'px';
  const pct=round(S.zoom*100);
  $('#zoomRead').textContent=pct+'%';
  $('#stZoom').textContent=pct+'%';
  if(cropOn) syncCropBox();
}
function fitToStage(){
  if(!baseCanvas) return;
  const st=$('#stage'), pad=56;
  const aw=Math.max(80,st.clientWidth-pad), ah=Math.max(80,st.clientHeight-pad);
  S.fitZoom=Math.min(aw/baseCanvas.width, ah/baseCanvas.height, 4);
  S.zoom=S.fitZoom;
  scheduleRender();
}
function setZoom(z,keepFit){
  S.zoom=clamp(z,0.02,8);
  if(!keepFit) scheduleRender(); else applyZoomCss();
}

/* ===================================================================
   8. l'historial: una foto de com estaven els ajustos, la geometria i les
   pinzellades a cada pas
=================================================================== */
function snap(){
  return {
    adj:Object.assign({},S.adj),
    src:S.src,
    rot:S.rot, flipH:S.flipH, flipV:S.flipV,
    crop:S.crop?Object.assign({},S.crop):null,
    preset:S.preset,
    ops:S.ops.map(o=>Object.assign({},o,{pts:o.pts.slice(),src:o.src?o.src.slice():null})),
  };
}
function push(label){
  S.history=S.history.slice(0,S.hIndex+1);
  S.history.push({label, st:snap()});
  if(S.history.length>60) S.history.shift();
  S.hIndex=S.history.length-1;
  drawHistory(); syncButtons(); drawThumbs();
}
function restore(i){
  const e=S.history[i]; if(!e) return;
  cancelaEndreca();
  $('#arreglaRes').hidden=true;      // el que deia «Arregla-la sola» ja no seria veritat
  const st=e.st;
  // ampliar canvia la foto mateixa: desfer-ho torna a la d'abans
  const geomChanged = st.src!==S.src||st.rot!==S.rot||st.flipH!==S.flipH||st.flipV!==S.flipV||
    JSON.stringify(st.crop)!==JSON.stringify(S.crop);
  S.src=st.src;
  S.adj=Object.assign({},st.adj);
  S.rot=st.rot; S.flipH=st.flipH; S.flipV=st.flipV;
  S.crop=st.crop?Object.assign({},st.crop):null;
  S.preset=st.preset;
  S.ops=st.ops.map(o=>Object.assign({},o,{pts:o.pts.slice(),src:o.src?o.src.slice():null}));
  S.hIndex=i;
  if(geomChanged){ buildBase(); fitToStage(); } else { renderPaint(); scheduleRender(); }
  syncSliders(); drawHistory(); syncButtons(); markPreset();
}
const undo=()=>{ if(!IA.treballant && S.hIndex>0) restore(S.hIndex-1); };
const redo=()=>{ if(!IA.treballant && S.hIndex<S.history.length-1) restore(S.hIndex+1); };
function drawHistory(){
  const list=$('#hlist'); list.textContent='';
  S.history.forEach((e,i)=>{
    const b=el('button','hitem'+(i>S.hIndex?' future':''));
    b.type='button';
    b.innerHTML='<i class="n">'+(i+1)+'</i><span>'+e.label+'</span>';
    if(i===S.hIndex) b.setAttribute('aria-current','true');
    b.onclick=()=>restore(i);
    list.appendChild(b);
  });
  list.scrollTop=list.scrollHeight;
}
function syncButtons(){
  $('#btnUndo').disabled=S.hIndex<=0;
  $('#btnRedo').disabled=S.hIndex>=S.history.length-1;
}

function buildRail(){
  const rail=$('#rail');
  for(const t of TOOLS){
    if(t.sep){ rail.appendChild(el('i','railsep')); continue; }
    const b=el('button','tool');
    b.type='button'; b.id='tool-'+t.id; b.title=t.name+'  ('+t.key+')';
    b.setAttribute('aria-pressed', t.id===S.tool?'true':'false');
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICON[t.id]+'</svg><i class="kbd">'+t.key+'</i>';
    b.onclick=()=>setTool(t.id);
    rail.appendChild(b);
  }
}
function setTool(id){
  cancelaEndreca();
  if(id!=='crop' && cropOn) endCrop(false);
  S.tool=id;
  for(const t of TOOLS) if(!t.sep) $('#tool-'+t.id).setAttribute('aria-pressed', t.id===id?'true':'false');

  const t=TOOLS.find(x=>x.id===id);

  $('#optKey').textContent=t.key;

/* ---- el panell d'opcions de cada eina ---- */
function buildOpts(id,hint){
  const box=$('#opts'); box.textContent='';
  const addHint=()=>{ const h=el('div','tiny',hint); box.appendChild(h); };

  const slider=(label,value,min,max,unit,on)=>{
    const row=el('div','row');
    const l=el('label',null,label), v=el('span','val',value+(unit||''));
    const r=document.createElement('input');
    r.type='range'; r.min=min; r.max=max; r.value=value; r.id='opt-'+label.replace(/\W/g,'');
    r.oninput=()=>{ v.textContent=r.value+(unit||''); on(+r.value); };
    row.append(l,v,r); box.appendChild(row);
  };
  const colorRow=()=>{
    const row=el('div','optrow');
    const sw=el('button','swatch'); sw.type='button'; sw.title='Color';
    const inp=document.createElement('input'); inp.type='color'; inp.value=S.brush.color; inp.id='brushColor';
    inp.oninput=()=>{ S.brush.color=inp.value; sw.style.background=inp.value; };
    sw.style.background=S.brush.color; sw.appendChild(inp);
    sw.onclick=e=>{ if(e.target!==inp) inp.click(); };
    const lab=el('span','tiny','Color del pinzell');
    row.append(sw,lab); box.appendChild(row);
  };

  if(id==='brush'||id==='eraser'||id==='clone'){
    slider('Mida',S.brush.size,1,400,' px',v=>{S.brush.size=v;updateCursorSize();});
    slider('Duresa',S.brush.hardness,0,100,'%',v=>S.brush.hardness=v);
    slider('Opacitat',S.brush.opacity,5,100,'%',v=>S.brush.opacity=v);
    if(id==='brush') colorRow();
    if(id==='clone'){
      const b=el('button','btn ghost','Esborra l\'origen'); b.type='button';
      b.onclick=()=>{ S.cloneSrc=null; $('#cloneSrc').style.display='none'; say('Origen del tampó esborrat.'); };
      box.appendChild(b);
    }
    addHint();
  }
  else if(id==='text'){
    slider('Cos',S.text.size,8,400,' px',v=>S.text.size=v);
    const row=el('div','optrow');
    const sel=document.createElement('select'); sel.id='textFont';
    [['sans','Plex Sans'],['serif','Serif'],['mono','Plex Mono']].forEach(([v,n])=>{
      const o=document.createElement('option'); o.value=v; o.textContent=n; sel.appendChild(o);
    });
    sel.value=S.text.font; sel.onchange=()=>S.text.font=sel.value;
    const bold=el('button','chip','Negreta'); bold.type='button';
    bold.setAttribute('aria-pressed',S.text.bold?'true':'false');
    bold.onclick=()=>{ S.text.bold=!S.text.bold; bold.setAttribute('aria-pressed',S.text.bold?'true':'false'); };
    row.append(sel,bold); box.appendChild(row);
    colorRow();
    addHint();
  }

/* ---- arregla la foto: «Arregla-la sola» i «Endreça» ----
   «Arregla-la sola» no fa cap màgia: mira la foto i mou els mateixos controls
   d'ajust que hi ha a sota, perquè es vegi què ha fet i es pugui retocar. Per
   triar quant els mou, prova valors sobre una còpia petita de la foto passant
   pel mateix tractament que la pantalla, i mira el que en surt: així el que
   diuen els números és el que es veu, sigui com sigui cada control. */
const ARREGLA={
  CONTROLA:['exposure','brightness','contrast','highlights','shadows','temperature','tint','vibrance'],
  // Els marges de «ja està bé» són amples a posta: una foto que ja estava bé
  // no s'ha de tocar. Amb marges estrets, a la foto bona de la prova li
  // canviava la claredat i el contrast.
  MED:0.46, MED_ZONA:[0.32,0.62], MED_PART:0.85,   // la claredat del mig: on volem, on ja està bé, quant s'hi acosta
  ESTESA:0.88, ESTESA_MIN:0.75,                    // del més fosc al més clar: on volem, i per sota de quant s'estira
  COLOR_PART:0.8,                                  // el color es corregeix una mica menys del compte, per prudència
};
function mostraArregla(){
  const M=256, W=baseCanvas.width, H=baseCanvas.height, k=Math.min(1,M/Math.max(W,H));
  const w=Math.max(1,round(W*k)), h=Math.max(1,round(H*k));
  const c=mkCanvas(w,h), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high'; x.drawImage(baseCanvas,0,0,w,h);
  return { x, w, h, orig:x.getImageData(0,0,w,h) };
}
function passaArregla(m,a){
  m.x.putImageData(m.orig,0,0);
  pipeline(m.x,m.w,m.h,a,1);
  return m.x.getImageData(0,0,m.w,m.h).data;
}
function mesuraArregla(d,conjunts){
  // conjunts: llistes de píxels (el de tota la foto i el dels més clars) on
  // es mesura el color de mitjana, per saber quin tint té
  const hist=new Uint32Array(256); let n=0,cr=0,cn=0,blancs=0;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2], y=(0.2126*r+0.7152*g+0.0722*b)|0;
    hist[y]++; n++; if(y>=253) blancs++;
    if(y>25&&y<230){ cr+=Math.max(r,g,b)-Math.min(r,g,b); cn++; }
  }
  const pct=q=>{ const t=q*n; let s=0; for(let v=0;v<256;v++){ s+=hist[v]; if(s>=t) return v/255; } return 1; };
  const tint=llista=>{
    let r=0,g=0,b=0; for(const p of llista){ const i=p*4; r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
    const k=1/(llista.length*255||1); r*=k; g*=k; b*=k;
    return { calent:r-b, verd:g-(r+b)/2 };     // >0: tira a groc/taronja · >0: tira a verd
  };
  return { p1:pct(.01), p10:pct(.10), med:pct(.5), p98:pct(.98), p99:pct(.99), blancs:blancs/n,
           croma:cn?cr/cn/255:0, tints:conjunts?conjunts.map(tint):null };
}
// busca el valor del control que fa que la mesura arribi a l'objectiu (la mesura ha de créixer amb el control)
function bisecta(lo,hi,f,obj){
  if(obj<=f(lo)) return lo; if(obj>=f(hi)) return hi;
  for(let i=0;i<11;i++){ const m=(lo+hi)/2; if(f(m)<obj) lo=m; else hi=m; }
  return (lo+hi)/2;
}
function calculaArregla(){
  const m=mostraArregla(), o=m.orig.data, N=m.w*m.h;
  // Dues pistes del tint de la foto. La que mana és el color de les parts més
  // clares, que solen ser blanques (un paper, un núvol, una paret al sol):
  // diu quant s'ha de corregir. L'altra és el color de mitjana de tota la
  // foto, que es deixa enganyar pels colors de l'escena (el cel blau, les
  // muntanyes verdes) i per això només té dret a vet: si diu el sentit
  // contrari, no es toca el color. Així una posta de sol, amb el sol taronja
  // però el cel blau, es queda com és.
  // Ho vam provar d'altres maneres que fallaven: buscar els objectes grisos
  // (amb un tint fort, un objecte blau es torna grisós i la foto groga sortia
  // més groga), i corregir només el que digués la pista més prudent (la foto
  // groga es quedava groga, i a la blava el verd de les muntanyes la feia rosa).
  const lum=new Float32Array(N), tota=[], clars=[];
  let colorMax=0; const crom=new Float32Array(N);
  for(let i=0,p=0;i<o.length;i+=4,p++){
    lum[p]=(0.2126*o[i]+0.7152*o[i+1]+0.0722*o[i+2])/255;
    crom[p]=(Math.max(o[i],o[i+1],o[i+2])-Math.min(o[i],o[i+1],o[i+2]))/255;
    if(lum[p]>0.05&&lum[p]<0.95) tota.push(p);
  }
  { // els més clars: el 3% de dalt, sense els cremats (un blanc cremat no diu
    // de quin color era). Cremat vol dir arribar a 254: amb un límit de 250, el
    // paper blanc d'una foto groguenca (vermell a 250) quedava fora, i era
    // justament la millor pista.
    const ord=Float32Array.from(lum).sort(), ll=ord[Math.floor(N*0.97)];
    for(let i=0,p=0;i<o.length;i+=4,p++) if(lum[p]>=ll && Math.max(o[i],o[i+1],o[i+2])<254) clars.push(p);
  }
  const p95croma=Float32Array.from(crom).sort()[Math.floor(N*0.95)]||0;
  const enBlancINegre=p95croma<0.03;
  const conjunts=[tota, clars];
  const a=Object.assign({},ADJ_DEF);
  const mesura=()=>mesuraArregla(passaArregla(m,a),conjunts);
  const prova=(k,v)=>{ const ant=a[k]; a[k]=v; const s=mesura(); a[k]=ant; return s; };

  // 1. el tint de color
  if(!enBlancINegre && tota.length>N*0.2 && clars.length>N*0.005){
    // a cada eix (calent/fred i verd/rosat): si el blanc té un tint que es nota
    // i la mitjana no diu el contrari, es busca el control que deixa el blanc neutre
    const eix=(clau,control,lim,llindar,signe)=>{
      const t=mesura().tints, mitjana=t[0][clau], blanc=t[1][clau];
      if(Math.abs(blanc)<llindar || Math.sign(mitjana)!==Math.sign(blanc)) return;
      a[control]=bisecta(-lim,lim,v=>signe*prova(control,v).tints[1][clau],0);
    };
    for(let volta=0;volta<2;volta++){
      eix('calent','temperature',100,0.02,1);   // la temperatura puja el vermell i baixa el blau
      eix('verd','tint',80,0.012,-1);            // el matís positiu baixa el verd
    }
    // Fins a 90: una foto feta a casa amb llum de bombeta en necessita més de
    // 70, i amb límits més baixos es quedava groga. Que la mitjana pugui vetar
    // el sentit és el que protegeix de passar-se'n.
    a.temperature=clamp(a.temperature*ARREGLA.COLOR_PART,-90,90);
    a.tint=clamp(a.tint*ARREGLA.COLOR_PART,-50,50);
    if(Math.abs(a.temperature)<3) a.temperature=0;
    if(Math.abs(a.tint)<3) a.tint=0;
  }
  // 2. la claredat: si el mig és massa fosc o massa clar, s'hi acosta
  const exposa=()=>{
    const med=mesura().med;
    if(med>=ARREGLA.MED_ZONA[0]&&med<=ARREGLA.MED_ZONA[1]) return;
    const obj=med+ARREGLA.MED_PART*(ARREGLA.MED-med);
    a.exposure=clamp(bisecta(-70,70,v=>prova('exposure',v).med,obj),-70,70);
  };
  exposa();
  // 3. el contrast: si la foto no va del fosc al clar, s'estira; sense cremar
  // més de l'1% dels píxels. Fins a 60: amb 40 una foto esvaïda no n'hi havia prou.
  {
    const s=mesura();
    if(s.p99-s.p1<ARREGLA.ESTESA_MIN){
      let c=bisecta(0,60,v=>{ const t=prova('contrast',v); return t.p99-t.p1; },ARREGLA.ESTESA);
      const cremat=v=>{ const t=prova('contrast',v); return t.blancs+(t.p1<=1/255?0.02:0); };
      if(cremat(c)>0.01) c=bisecta(0,c,cremat,0.01);
      a.contrast=c;
      exposa();      // el contrast mou el mig: es torna a mirar la claredat
    }
  }
  // 4. les ombres massa tapades, i les llums cremades
  if(mesura().p10<0.08) a.shadows=clamp(bisecta(0,40,v=>prova('shadows',v).p10,0.11),0,40);
  { const s=mesura(); if(s.blancs>0.02||s.p98>0.985) a.highlights=clamp(bisecta(-50,0,v=>prova('highlights',v).p98,0.95),-50,0); }
  // 5. els colors apagats
  if(!enBlancINegre && mesura().croma<0.08) a.vibrance=clamp(bisecta(0,30,v=>prova('vibrance',v).croma,0.11),0,30);

  const res={};
  for(const k of ARREGLA.CONTROLA) res[k]=round(a[k]);
  return res;
}
function explicaArregla(v){
  const fets=[];
  if(v.exposure>=4) fets.push('més clara'); else if(v.exposure<=-4) fets.push('més fosca');
  if(v.contrast>=4) fets.push('amb més contrast');
  if(v.shadows>=4) fets.push('amb les ombres aclarides');
  if(v.highlights<=-4) fets.push('amb les llums recuperades');
  if(v.temperature<=-4) fets.push('menys groga'); else if(v.temperature>=4) fets.push('menys blava');
  if(v.tint>=4) fets.push('menys verda'); else if(v.tint<=-4) fets.push('menys rosada');
  if(v.vibrance>=4) fets.push('amb els colors més vius');
  if(!fets.length) return 'Aquesta foto ja estava bé: no hi ha calgut canviar res.';
  const llista=fets.length===1?fets[0]:fets.slice(0,-1).join(', ')+' i '+fets[fets.length-1];
  return 'Ara és '+llista+'. Ho pots retocar als controls de sota.';
}
function arreglaSola(){
  if(!baseCanvas||IA.treballant) return;
  cancelaEndreca();
  const v=calculaArregla();
  Object.assign(S.adj,v);
  S.preset=null; syncSliders(); markPreset(); scheduleRender();
  const t=explicaArregla(v);
  push('Arregla-la sola');
  const r=$('#arreglaRes'); if(r){ r.textContent=t; r.hidden=false; }
  say(t);
}

/* «Endreça»: gira la foto uns quants graus perquè l'horitzó quedi recte, i la
   retalla el just perquè no quedin cantonades buides, amb la mateixa forma.
   Mentre es mou el control només es gira la imatge de la pantalla, amb una
   reixa al damunt per veure-hi les rectes; la foto no es toca fins a APLICA,
   que si no, cada retoc la tornaria a passar pel girat i la perdria. */
S.endreca=0;
function escalaEndreca(W,H,rad){
  const c=Math.abs(Math.cos(rad)), s=Math.abs(Math.sin(rad));
  return Math.min(W/(W*c+H*s), H/(W*s+H*c));
}
const grausText = g => (g>0?'+':'')+String(round(g*10)/10).replace('.',',')+'°';
function previsualitzaEndreca(){
  const g=S.endreca, wrap=$('#wrap');
  if(!g || !baseCanvas){ view.style.transform=''; wrap.style.overflow=''; $('#reixa').hidden=true; return; }
  const k=escalaEndreca(baseCanvas.width,baseCanvas.height,g*Math.PI/180);
  view.style.transform='rotate('+g+'deg) scale('+(1/k)+')';
  wrap.style.overflow='hidden';
  $('#reixa').hidden=false;
}
function pintaEndreca(){
  const g=S.endreca;
  const v=$('#endrecaVal'), r=$('#sl-endreca'), b=$('#endrecaBotons');
  if(!r) return;
  r.value=g; v.textContent=g?grausText(g):'0°'; v.classList.toggle('zero',!g); r.classList.toggle('touched',!!g);
  b.hidden=!g;
  previsualitzaEndreca();
}
function cancelaEndreca(){ if(S.endreca){ S.endreca=0; pintaEndreca(); } }
function aplicaEndreca(){
  const graus=S.endreca; if(!graus||!baseCanvas||IA.treballant) return;
  const rad=graus*Math.PI/180, W=baseCanvas.width, H=baseCanvas.height;
  const k=escalaEndreca(W,H,rad)*0.998;            // un pèl més, que la vora no agafi res de fora
  const ow=Math.max(8,Math.floor(W*k)), oh=Math.max(8,Math.floor(H*k));
  const out=mkCanvas(ow,oh), x=out.getContext('2d');
  x.imageSmoothingQuality='high';
  x.translate(ow/2,oh/2); x.rotate(rad); x.drawImage(baseCanvas,-W/2,-H/2);
  // les pinzellades giren amb la foto
  const c=Math.cos(rad), s=Math.sin(rad);
  mapOps((px,py)=>{ const dx=px-W/2, dy=py-H/2; return [dx*c-dy*s+ow/2, dx*s+dy*c+oh/2]; });
  S.src=out; S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
  S.cloneSrc=null; $('#cloneSrc').style.display='none';
  S.endreca=0; pintaEndreca();
  buildBase(); fitToStage();
  push('Endreça '+grausText(graus));
  say('Endreçada '+grausText(graus)+'. Ara fa '+ow+' × '+oh+' px.');
}
function grupArregla(){
  const box=el('div','grp arregla');
  box.appendChild(el('h4',null,'Arregla la foto'));
  box.appendChild(el('div','tiny','Corregeix la claredat, el contrast i el color de les fotos fosques, cremades o amb un color estrany.'));
  const b=el('button','btn primary','✦ Arregla-la sola'); b.type='button'; b.id='arregla';
  b.onclick=arreglaSola;
  box.appendChild(b);
  const res=el('div','tiny'); res.id='arreglaRes'; res.hidden=true; box.appendChild(res);

  const row=el('div','row');
  const l=el('label',null,'Endreça'); l.htmlFor='sl-endreca';
  const v=el('span','val zero','0°'); v.id='endrecaVal';
  const r=document.createElement('input');
  r.type='range'; r.min=-15; r.max=15; r.step=0.1; r.value=0; r.id='sl-endreca';
  r.setAttribute('aria-label','Endreça');
  r.oninput=()=>{ S.endreca=+r.value; pintaEndreca(); };
  l.ondblclick=cancelaEndreca;
  row.append(l,v,r); box.appendChild(row);
  const bot=el('div','optrow'); bot.id='endrecaBotons'; bot.hidden=true;
  const ap=el('button','btn primary','Aplica'); ap.type='button'; ap.id='endrecaAplica'; ap.onclick=aplicaEndreca;
  const ca=el('button','btn','Cancel·la'); ca.type='button'; ca.id='endrecaCancela'; ca.onclick=cancelaEndreca;
  bot.append(ap,ca,el('span','tiny','Es retalla una mica, que no quedin cantonades buides.'));
  box.appendChild(bot);
  return box;
}

/* ---- els filtres ---- */
let thumbSrc=null;
function buildFilters(){
  const grid=$('#fgrid'); grid.textContent='';
  for(const p of PRESETS){
    const b=el('button','fcard'); b.type='button'; b.id='fc-'+p.id;
    b.setAttribute('aria-pressed',S.preset===p.id?'true':'false');
    const c=mkCanvas(132,132); c.className='thumb';
    b.append(c, el('span',null,p.name));
    b.onclick=()=>{
      S.adj=Object.assign({},ADJ_DEF,p.adj);
      S.preset=p.id; syncSliders(); markPreset(); scheduleRender();
      push('Filtre: '+p.name);
    };
    grid.appendChild(b);
  }
}
function markPreset(){
  for(const p of PRESETS){
    const n=$('#fc-'+p.id); if(n) n.setAttribute('aria-pressed',S.preset===p.id?'true':'false');
  }
}
function drawThumbs(){
  if(!baseCanvas) return;
  // un quadradet de la imatge d'ara, el mateix per a totes les miniatures
  const N=132;
  if(!thumbSrc) thumbSrc=mkCanvas(N,N);
  const tx=thumbSrc.getContext('2d');
  const bw=baseCanvas.width, bh=baseCanvas.height, s=Math.min(bw,bh);
  tx.clearRect(0,0,N,N);
  tx.imageSmoothingQuality='high';
  tx.drawImage(baseCanvas,(bw-s)/2,(bh-s)/2,s,s,0,0,N,N);
  if(paintCanvas) tx.drawImage(paintCanvas,(bw-s)/2,(bh-s)/2,s,s,0,0,N,N);
  for(const p of PRESETS){
    const card=$('#fc-'+p.id); if(!card) continue;
    const c=card.querySelector('canvas'), cx=c.getContext('2d',{willReadFrequently:true});
    cx.clearRect(0,0,N,N);
    cx.drawImage(thumbSrc,0,0);
    pipeline(cx,N,N,Object.assign({},ADJ_DEF,p.adj),N/s);
  }
}

   11. el retall
=================================================================== */
let cropOn=false, cropRect=null, cropAR=0;
function startCrop(){
  if(!baseCanvas) return;
  cropOn=true;
  cropRect={x:0,y:0,w:baseCanvas.width,h:baseCanvas.height};
  $('#crop').classList.add('on');
  syncCropBox();
}
function syncCropBox(){
  if(!cropRect) return;
  const z=S.zoom, b=$('#cropBox');
  b.style.left=(cropRect.x*z)+'px'; b.style.top=(cropRect.y*z)+'px';
  b.style.width=(cropRect.w*z)+'px'; b.style.height=(cropRect.h*z)+'px';
  say('Marc: '+round(cropRect.w)+' × '+round(cropRect.h)+' px');
}
function applyAR(){
  if(!cropAR||!cropRect) return;
  const bw=baseCanvas.width, bh=baseCanvas.height;
  let w=cropRect.w, h=w/cropAR;
  if(h>bh){ h=bh; w=h*cropAR; }
  if(w>bw){ w=bw; h=w/cropAR; }
  cropRect.w=w; cropRect.h=h;
  cropRect.x=clamp(cropRect.x,0,bw-w); cropRect.y=clamp(cropRect.y,0,bh-h);
  syncCropBox();
}
function endCrop(apply){
  cropOn=false; $('#crop').classList.remove('on');
  if(!apply||!cropRect) return;
  const r={x:round(cropRect.x),y:round(cropRect.y),w:round(cropRect.w),h:round(cropRect.h)};
  if(r.w<8||r.h<8) return;
  if(r.w===baseCanvas.width&&r.h===baseCanvas.height&&r.x===0&&r.y===0) return;
  const off=S.crop?{x:S.crop.x,y:S.crop.y}:{x:0,y:0};
  S.crop={x:off.x+r.x, y:off.y+r.y, w:r.w, h:r.h};
  mapOps((x,y)=>[x-r.x,y-r.y]);
  buildBase(); fitToStage();
  push('Retalla a '+r.w+' × '+r.h);
}
(function cropDrag(){
  const box=$('#cropBox');
  let mode=null, start=null, orig=null;
  const toBase=e=>{
    const rc=view.getBoundingClientRect();
    return { x:(e.clientX-rc.left)/S.zoom, y:(e.clientY-rc.top)/S.zoom };
  };
  box.addEventListener('pointerdown',e=>{
    if(!cropOn) return;
    e.preventDefault(); e.stopPropagation();
    mode=e.target.dataset.h||'move';
    start=toBase(e); orig=Object.assign({},cropRect);
    box.setPointerCapture(e.pointerId);
  });
  box.addEventListener('pointermove',e=>{
    if(!mode) return;
    const p=toBase(e), dx=p.x-start.x, dy=p.y-start.y;
    const bw=baseCanvas.width, bh=baseCanvas.height;
    let r=Object.assign({},orig);
    if(mode==='move'){
      r.x=clamp(orig.x+dx,0,bw-r.w); r.y=clamp(orig.y+dy,0,bh-r.h);
    } else {
      if(mode.includes('w')){ const nx=clamp(orig.x+dx,0,orig.x+orig.w-16); r.w=orig.x+orig.w-nx; r.x=nx; }
      if(mode.includes('e')){ r.w=clamp(orig.w+dx,16,bw-orig.x); }
      if(mode.includes('n')){ const ny=clamp(orig.y+dy,0,orig.y+orig.h-16); r.h=orig.y+orig.h-ny; r.y=ny; }
      if(mode.includes('s')){ r.h=clamp(orig.h+dy,16,bh-orig.y); }
      if(cropAR){
        if(mode==='n'||mode==='s') r.w=clamp(r.h*cropAR,16,bw-r.x);
        else r.h=clamp(r.w/cropAR,16,bh-r.y);
        if(mode.includes('w')) r.x=clamp(orig.x+orig.w-r.w,0,bw-r.w);
        if(mode.includes('n')) r.y=clamp(orig.y+orig.h-r.h,0,bh-r.h);
      }
    }
    cropRect=r; syncCropBox();
  });
  const up=e=>{ if(mode){ mode=null; try{box.releasePointerCapture(e.pointerId);}catch(_){} } };
  box.addEventListener('pointerup',up);
  box.addEventListener('pointercancel',up);
})();

function evToBase(e){
  const rc=view.getBoundingClientRect();
  return { x:(e.clientX-rc.left)/S.zoom, y:(e.clientY-rc.top)/S.zoom };
}
function updateCursorSize(){
  const c=$('#cursor'), d=S.brush.size*S.zoom;
  c.style.width=d+'px'; c.style.height=d+'px';
  c.style.marginLeft=(-d/2)+'px'; c.style.marginTop=(-d/2)+'px';
}
/* Mentre pintes, nomes es torna a dibuixar la pinzellada d'ara damunt de com
   estava la capa abans de comencar-la. Si es tornessin a pintar totes a cada
   moviment del dit, amb cent pinzellades fetes el pinzell ja aniria a batzegades. */
let stroke=null, paintSnap=null, paintSnapCtx=null;
function savePaintSnap(){
  if(!paintSnap||paintSnap.width!==paintCanvas.width||paintSnap.height!==paintCanvas.height){
    paintSnap=mkCanvas(paintCanvas.width,paintCanvas.height);
    paintSnapCtx=paintSnap.getContext('2d');
  }
  paintSnapCtx.clearRect(0,0,paintSnap.width,paintSnap.height);
  paintSnapCtx.drawImage(paintCanvas,0,0);
}
function restorePaintSnap(){
  paintCtx.clearRect(0,0,paintCanvas.width,paintCanvas.height);
  paintCtx.drawImage(paintSnap,0,0);
}
view.addEventListener('pointerdown',e=>{
  if(!baseCanvas||cropOn) return;
  const p=evToBase(e);
  const t=S.tool;

  if(t==='pick'){
    const px=workCtx.getImageData(round(p.x*renderScale),round(p.y*renderScale),1,1).data;
    const hex='#'+[px[0],px[1],px[2]].map(n=>n.toString(16).padStart(2,'0')).join('');
    S.brush.color=hex; buildOpts('pick',TOOLS.find(x=>x.id==='pick').hint);
    say('Color agafat: '+hex);
    return;
  }
  if(t==='text'){ showTextEdit(p,e); return; }
  if(t==='move'){
    const st=$('#stage'); st.classList.add('panning');
    const sx=st.scrollLeft, sy=st.scrollTop, cx=e.clientX, cy=e.clientY;
    view.setPointerCapture(e.pointerId);
    const mv=ev=>{ st.scrollLeft=sx-(ev.clientX-cx); st.scrollTop=sy-(ev.clientY-cy); };
    const up=()=>{ st.classList.remove('panning'); view.removeEventListener('pointermove',mv); view.removeEventListener('pointerup',up); view.removeEventListener('pointercancel',up); };
    view.addEventListener('pointermove',mv); view.addEventListener('pointerup',up); view.addEventListener('pointercancel',up);
    return;
  }
  if(t==='clone'){
    if(e.altKey){
      S.cloneSrc=[p.x,p.y];
      const m=$('#cloneSrc');
      m.style.display='block'; m.style.left=(p.x*S.zoom)+'px'; m.style.top=(p.y*S.zoom)+'px';
      say('Origen del tampó fixat.');
      return;
    }
    if(!S.cloneSrc){ say('Fes Alt+clic per fixar l\'origen del tampó.'); return; }
  }
  if(t!=='brush'&&t!=='eraser'&&t!=='clone') return;

  e.preventDefault();
  view.setPointerCapture(e.pointerId);
  stroke={
    type: t==='eraser'?'erase':(t==='clone'?'clone':'brush'),
    pts:[p.x,p.y],
    size:S.brush.size, hardness:S.brush.hardness, opacity:S.brush.opacity,
    color:S.brush.color,
    src: t==='clone'? S.cloneSrc.slice() : null,
  };
  ensurePaint();
  savePaintSnap();
  S.ops.push(stroke);
  drawOp(stroke); scheduleRender();
});
view.addEventListener('pointermove',e=>{
  if(!baseCanvas) return;
  const p=evToBase(e);
  $('#stPos').textContent=round(p.x)+', '+round(p.y);
  const painty=(S.tool==='brush'||S.tool==='eraser'||S.tool==='clone')&&!cropOn;
  const cur=$('#cursor');
  if(painty){
    cur.style.display='block'; updateCursorSize();
    cur.style.left=(p.x*S.zoom)+'px'; cur.style.top=(p.y*S.zoom)+'px';
  } else cur.style.display='none';
  if(!stroke) return;
  const n=stroke.pts.length;
  if(Math.hypot(p.x-stroke.pts[n-2],p.y-stroke.pts[n-1])<Math.max(0.7,S.brush.size*0.07)) return;
  stroke.pts.push(p.x,p.y);
  restorePaintSnap(); drawOp(stroke); scheduleRender();
});
function endStroke(e){
  if(!stroke) return;
  const label={brush:'Pinzellada',erase:'Esborrat',clone:'Clonació'}[stroke.type];
  stroke=null;
  try{ view.releasePointerCapture(e.pointerId); }catch(_){}
  push(label);
}
view.addEventListener('pointerup',endStroke);
view.addEventListener('pointercancel',endStroke);
view.addEventListener('pointerleave',()=>{ if(!stroke) $('#cursor').style.display='none'; });

function loadImage(src,name,isSample){
  const img=new Image();
  img.onload=()=>{
    const c=mkCanvas(img.naturalWidth,img.naturalHeight);
    c.getContext('2d').drawImage(img,0,0);
    adopt(c,name,isSample);
  };
  img.onerror=()=>say('No s\'ha pogut llegir aquesta imatge.');
  img.src=src;
}
function adopt(canvas,name,isSample){
  if(IA.treballant) IA.atura=true;
  S.endreca=0; if($('#sl-endreca')) pintaEndreca();
  if($('#arreglaRes')) $('#arreglaRes').hidden=true;
  IA.factorTriat=false;
  S.src=canvas; S.name=name||'imatge.png'; S.sample=!!isSample;
  S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
  S.adj=Object.assign({},ADJ_DEF); S.preset='cap';
  S.ops=[]; S.cloneSrc=null; $('#cloneSrc').style.display='none';
  paintCanvas=paintCtx=scratch=scratchCtx=null; thumbSrc=null;
  S.history=[]; S.hIndex=-1;
  buildBase(); syncSliders(); markPreset();
  $('#fileName').textContent=S.name;
  fitToStage(); push('Obre '+S.name);
  if(S.tool==='crop') startCrop();
  if($('#pane-amp').classList.contains('on')) pintaAmplia();
  say(isSample
    ? 'Imatge d\'exemple generada per la pàgina. Obre\'n una teva per començar.'
    : S.src.width+' × '+S.src.height+' px carregats.');
}
function openFile(f){
  if(!f) return;
  if(!/^image\//.test(f.type)){ say('Aquest fitxer no és una imatge.'); return; }
  const r=new FileReader();
  r.onload=()=>loadImage(r.result,f.name,false);
  r.onerror=()=>say('No s\'ha pogut llegir el fitxer.');
  r.readAsDataURL(f);
}
$('#file').onchange=e=>{ openFile(e.target.files[0]); e.target.value=''; };
$('#btnOpen').onclick=()=>$('#file').click();

let dragDepth=0;
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{
  if(!e.dataTransfer||![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); dragDepth++; $('#drop').classList.add('on');
}));
['dragleave','dragend'].forEach(t=>document.addEventListener(t,()=>{
  dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) $('#drop').classList.remove('on');
}));
document.addEventListener('drop',e=>{
  if(!e.dataTransfer) return;
  e.preventDefault(); dragDepth=0; $('#drop').classList.remove('on');
  openFile(e.dataTransfer.files&&e.dataTransfer.files[0]);
});
document.addEventListener('paste',e=>{
  const it=e.clipboardData&&e.clipboardData.items;
  if(!it) return;
  for(const i of it) if(i.type&&i.type.startsWith('image/')){ openFile(i.getAsFile()); break; }
});

function dialog(title,build,onOk,okLabel){
  const scrim=el('div','scrim');

  d.querySelector('h3').textContent=title;

  const cancel=el('button','btn','Tanca'); cancel.type='button'; cancel.onclick=close;
  foot.appendChild(cancel);

    const ok=el('button','btn primary',okLabel||'D\'acord'); ok.type='button';

  }
  scrim.appendChild(d);

// A la web de debo, una baixada normal del navegador. Dins d'un artifact de
// claude.ai la pagina no pot baixar res ella mateixa i ho ha de demanar a la
// plataforma: per aixo es prova primer alla i, si no hi es, l'enllac.
function desaFitxer(blob,nom){
  if(downloads) return downloads.save({filename:nom,data:blob});
  return new Promise((res,rej)=>{
    try{
      const u=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=u; a.download=nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),30000);
      res({status:'saved'});
    }catch(err){ rej({code:'unavailable',message:String(err)}); }
  });
}
function baseName(){
  const n=S.name.replace(/\.[^.]+$/,'');
  return (n||'imatge')+'-retocada';
}

    });

      c.setAttribute('aria-pressed',v===scale?'true':'false');
