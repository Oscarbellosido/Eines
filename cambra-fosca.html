/* ===================================================================
   16d. arreglar les cares
   Per a fotos velles, borroses o petites. RetinaFace troba les cares i cinc
   punts de cada una (els ulls, el nas i les comissures de la boca); amb
   aquests punts cada cara es posa dreta a 512 × 512, com GFPGAN l'espera, i
   GFPGAN la torna nítida. La cara arreglada es torna al seu lloc amb la vora
   esvaïda. És el que fa el projecte original (facexlib), sense el model que
   retalla la cara pel contorn: s'enganxa un quadrat amb les vores suaus.
=================================================================== */
const CARA_PLANTILLA=[[192.98138,239.94708],[318.90277,240.1936],[256.63416,314.01935],[201.26117,371.41043],[313.08905,371.15118]];
function estatCares(){
  const b=$('#cares'), info=$('#caresInfo'); if(!b||!info) return;
  b.disabled=IA.treballant || IA.motor==null || !baseCanvas;
  const C=IA.cares, falta=[];
  if(IA.motor && !IA.baixats[IA.motors[IA.motor].wasm] && IA.carregat!==IA.motor) falta.push(IA.motors[IA.motor].mb);
  if(!IA.baixats[C.troba] && !C.sTroba) falta.push(C.mbTroba);
  if(!(C.arregla.every(f=>IA.baixats[f])) && !C.sArregla) falta.push(C.mbArregla);
  const suma=falta.reduce((a,b)=>a+b,0);
  let t=suma ? 'La primera vegada es baixen '+mb(suma)+'.' : 'La IA ja és en aquest aparell.';
  if(IA.mode==='mobil') t+=' És una IA gran: va millor des de l\'ordinador, i al mòbil pot quedar-se sense memòria.';
  info.textContent=t+' «Suau» barreja la cara arreglada amb l\'original, que quedi més natural.';
}
async function preparaSessioCares(progres){
  const C=IA.cares;
  if(!C.sTroba){
    const b=await baixaIA(C.troba,(a,t)=>progres('la IA que troba les cares',a,t||C.mbTroba*1048576));
    C.sTroba=(await creaSessio(b)).sessio;
  }
  if(!C.sArregla){
    // els dos trossos, un darrere l'altre, i ajuntats en un de sol
    const parts=[]; let fet=0;
    for(const f of C.arregla){
      parts.push(await baixaIA(f,(a,t)=>progres('la IA de les cares',fet+a,C.mbArregla*1048576)));
      fet+=parts[parts.length-1].length;
    }
    const tot=new Uint8Array(fet); let o=0; for(const p of parts){ tot.set(p,o); o+=p.length; }
    parts.length=0;
    progres('preparant el model',0,0);
    const r=await creaSessio(tot);
    C.sArregla=r.sessio; C.motorReal=r.motorReal;
  }
}

/* On són les cares: la foto, com a molt de 1.280 punts i amb els costats
   múltiples de 32, en BGR i menys la mitjana (com el projecte original). Es
   queden les que el model veu segures (97%), sense repetides i amb els ulls
   a 5 punts o més l'un de l'altre. */
async function trobaCares(src){
  const W=src.width, H=src.height, k=Math.min(1,1280/Math.max(W,H));
  const w=Math.max(1,round(W*k)), h=Math.max(1,round(H*k)), pw=Math.ceil(w/32)*32, ph=Math.ceil(h/32)*32;
  const c=mkCanvas(pw,ph), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high'; x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,pw,ph).data, P=pw*ph, e=new Float32Array(3*P);
  // (el que sobra fins al múltiple de 32 queda negre)
  for(let i=0,j=0;i<P;i++,j+=4){ e[i]=d[j+2]-104; e[P+i]=d[j+1]-117; e[2*P+i]=d[j]-123; }
  const sessio=IA.cares.sTroba;
  const res=await sessio.run({[sessio.inputNames[0]]: new ort.Tensor('float32',e,[1,3,ph,pw])});
  const [nl,nc,np]=sessio.outputNames, loc=res[nl].data, conf=res[nc].data, ld=res[np].data;
  const cares=[]; let n=0;
  for(const [st,mides] of [[8,[16,32]],[16,[64,128]],[32,[256,512]]]){
    const fh=ph/st, fw=pw/st;
    for(let i=0;i<fh;i++) for(let j=0;j<fw;j++) for(const m of mides){
      const sc=conf[n*2+1];
      if(sc>0.97){
        const cx=(j+0.5)*st, cy=(i+0.5)*st;
        const bx=cx+loc[n*4]*0.1*m, by=cy+loc[n*4+1]*0.1*m, bw=m*Math.exp(loc[n*4+2]*0.2), bh=m*Math.exp(loc[n*4+3]*0.2);
        const punts=[]; for(let q=0;q<5;q++) punts.push([(cx+ld[n*10+q*2]*0.1*m)/k, (cy+ld[n*10+q*2+1]*0.1*m)/k]);
        cares.push({ sc, caixa:[(bx-bw/2)/k,(by-bh/2)/k,(bx+bw/2)/k,(by+bh/2)/k], punts });
      }
      n++;
    }
  }
  for(const t of Object.values(res)) if(t.dispose) t.dispose();
  cares.sort((a,b)=>b.sc-a.sc);
  const queden=[], area=b=>(b[2]-b[0])*(b[3]-b[1]);
  for(const f of cares){
    const r=queden.every(g=>{ const a=f.caixa,b=g.caixa;
      const iw=Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0])), ih=Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));
      return iw*ih/(area(a)+area(b)-iw*ih)<=0.4; });
    if(r && Math.hypot(f.punts[0][0]-f.punts[1][0],f.punts[0][1]-f.punts[1][1])>=5) queden.push(f);
  }
  return queden;
}
// El gir, l'escala i el desplaçament que porten els cinc punts on la
// plantilla els vol, el més a prop possible (mínims quadrats)
function semblanca(p,q){
  let pcx=0,pcy=0,qcx=0,qcy=0; const n=p.length;
  for(let i=0;i<n;i++){ pcx+=p[i][0]; pcy+=p[i][1]; qcx+=q[i][0]; qcy+=q[i][1]; }
  pcx/=n; pcy/=n; qcx/=n; qcy/=n;
  let sa=0,sb=0,sp=0;
  for(let i=0;i<n;i++){ const px=p[i][0]-pcx, py=p[i][1]-pcy, qx=q[i][0]-qcx, qy=q[i][1]-qcy;
    sa+=px*qx+py*qy; sb+=px*qy-py*qx; sp+=px*px+py*py; }
  const a=sa/sp, b=sb/sp;
  return { a, b, tx:qcx-(a*pcx-b*pcy), ty:qcy-(b*pcx+a*pcy) };
}
// La vora esvaïda del quadrat que s'enganxa: 25 punts cap a dins i uns 8 de
// fos, com el projecte original fa en enganxar sense el model del contorn
let MASCARA_CARA=null;
function mascaraCara(){
  if(MASCARA_CARA) return MASCARA_CARA;
  const m=new Float32Array(512*512);
  for(let y=0;y<512;y++) for(let x=0;x<512;x++){
    const dd=Math.min(x,y,511-x,511-y), t=clamp((dd-17)/24,0,1);
    m[y*512+x]=t*t*(3-2*t);
  }
  return MASCARA_CARA=m;
}
async function arreglaUnaCara(feina, cara, forca){
  const T=semblanca(cara.punts, CARA_PLANTILLA);
  // la cara, dreta i a 512 (fora de la foto, el gris que hi posa el projecte)
  const fc=mkCanvas(512,512), fx=fc.getContext('2d',{willReadFrequently:true});
  fx.fillStyle='rgb(132,133,135)'; fx.fillRect(0,0,512,512);
  fx.imageSmoothingQuality='high';
  fx.setTransform(T.a,T.b,-T.b,T.a,T.tx,T.ty);
  fx.drawImage(feina,0,0);
  fx.setTransform(1,0,0,1,0,0);
  const im=fx.getImageData(0,0,512,512), d=im.data, P=512*512, e=new Float32Array(3*P);
  for(let i=0,j=0;i<P;i++,j+=4){ e[i]=d[j]/127.5-1; e[P+i]=d[j+1]/127.5-1; e[2*P+i]=d[j+2]/127.5-1; }
  const s=IA.cares.sArregla;
  const res=await s.run({[s.inputNames[0]]: new ort.Tensor('float32',e,[1,3,512,512])});
  const sortida=res[s.outputNames[0]], y=sortida.data, mk=mascaraCara();
  for(let i=0,j=0;i<P;i++,j+=4){
    d[j]=(clamp(y[i],-1,1)+1)*127.5; d[j+1]=(clamp(y[P+i],-1,1)+1)*127.5; d[j+2]=(clamp(y[2*P+i],-1,1)+1)*127.5;
    d[j+3]=mk[i]*forca*255;
  }
  if(sortida.dispose) sortida.dispose();
  fx.putImageData(im,0,0);
  // i al seu lloc, amb el gir de tornada
  const s2=T.a*T.a+T.b*T.b, ia=T.a/s2, ib=T.b/s2;
  const ox=feina.getContext('2d');
  ox.save();
  ox.imageSmoothingQuality='high';
  ox.setTransform(ia,-ib,ib,ia,-(ia*T.tx+ib*T.ty),-(-ib*T.tx+ia*T.ty));
  ox.drawImage(fc,0,0);
  ox.restore();
}
async function arreglaCares(){
  if(IA.treballant || !baseCanvas) return;
  if(IA.motor==null){ say('Un moment: encara s\'està mirant què pot fer servir aquest aparell.'); return; }
  cancelaEndreca(); if(cropOn){ endCrop(false); setTool('move'); } hideTextEdit();
  IA.treballant=true; IA.atura=false; estatCares();
  const t0=performance.now(); mantenEncesa();
  try{
    const progres=(que,a,t)=>{
      if(IA.atura) throw new Error('aturat');
      vel(t ? 'Baixant '+que+'…' : 'Preparant la IA…', t ? a/t : 0, t ? mb(a/1048576)+' de '+mb(t/1048576)+' · només la primera vegada' : 'Només la primera vegada.');
    };
    vel('Preparant…',0,'');
    await preparaMotor(progres);
    await preparaSessioCares(progres);
    if(IA.atura) throw new Error('aturat');
    vel('Buscant cares…',0,'');
    const cares=await trobaCares(baseCanvas);
    if(!cares.length){ say('No he trobat cap cara prou clara. Va millor amb cares de cara, no de perfil, i que no siguin molt petites.'); return; }
    const feina=mkCanvas(baseCanvas.width,baseCanvas.height);
    feina.getContext('2d').drawImage(baseCanvas,0,0);
    for(let i=0;i<cares.length;i++){
      vel('Arreglant les cares…',i/cares.length,'Cara '+(i+1)+' de '+cares.length+(IA.cares.motorReal==='gpu'?' · amb la gràfica':' · amb el processador, pot trigar'));
      await new Promise(r=>setTimeout(r,20));
      await arreglaUnaCara(feina, cares[i], IA.cares.forca);
      if(IA.atura) throw new Error('aturat');
    }
    // com quan s'esborra o s'amplia, la foto nova passa a ser la foto
    S.src=feina; S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
    buildBase(); scheduleRender();
    push('Arregla les cares ('+cares.length+')');
    const temps=minuts((performance.now()-t0)/1000);
    const r=$('#caresRes');
    if(r){ r.hidden=false; r.textContent='✓ '+(cares.length===1?'Una cara arreglada':cares.length+' cares arreglades')+' en '+temps+', '+(IA.cares.motorReal==='gpu'?'amb la gràfica':'amb el processador')+
      '. Si queda massa perfecta, desfés-ho i prova «Suau».'; }
    say((cares.length===1?'Una cara arreglada':cares.length+' cares arreglades')+' en '+temps+'.');
  }catch(e){
    const msg=String(e&&e.message||e);
    if(msg==='aturat') say('Aturat. La foto és com era.');
    else { say('No s\'han pogut arreglar les cares: '+msg+'.'); console.warn('Cares:',e); }
  }finally{
    IA.treballant=false; IA.atura=false;
    try{ if(bloqueigPantalla) await bloqueigPantalla.release(); }catch(e){}
    bloqueigPantalla=null;
    $('#vel').hidden=true;
    estatCares();
  }
}

/* ===================================================================
   16g. soroll i borrós
   El soroll i el gra (de les fotos de nit, de les velles, de les de WhatsApp)
   els treu SCUNet, per trossos de mida fixa. El borrós es fa amb el model
   lleuger d'ampliar: amplia el tros per 4 (i en ampliar torna nítid el que
   era tou) i el torna a la seva mida, així que la foto no canvia de mida.
   La força barreja el resultat amb l'original.
=================================================================== */
function estatNitida(){
  const b=$('#nitGo'), info=$('#nitInfo'); if(!b||!info) return;
  const N=IA.nitida, soroll=N.que==='soroll';
  for(const v of ['soroll','borros']) $('#nitQ-'+v).setAttribute('aria-pressed', v===N.que?'true':'false');
  $('#nitDesc').textContent = soroll
    ? 'Treu el gra, el soroll de les fotos fosques i els quadrets del JPEG, sense perdre el detall. Si queda massa llisa, prova «Suau».'
    : 'Torna més nítida una foto una mica desenfocada o tova. Si està molt borrosa, el que s\'ha perdut no torna: s\'inventa una textura que s\'hi assembla.';
  b.textContent = soroll ? '✦ Treu el soroll' : '✦ Fes-la més nítida';
  b.disabled=IA.treballant || IA.motor==null || !baseCanvas;
  const falta=[];
  if(IA.motor && !IA.baixats[IA.motors[IA.motor].wasm] && IA.carregat!==IA.motor) falta.push(IA.motors[IA.motor].mb);
  if(soroll){ if(!IA.baixats[N.fitxer] && !N.sessio) falta.push(N.mb); }
  else if(!IA.baixats[IA.models.mobil.fitxer] && !N.sBorros) falta.push(IA.models.mobil.mb);
  const suma=falta.reduce((a,b)=>a+b,0);
  info.textContent=(suma ? 'La primera vegada es baixen '+mb(suma)+'.' : 'La IA ja és en aquest aparell.')+
    ' Va per trossos: si trigarà més de '+minuts(IA.LLARG)+', abans t\'ho diu.';
  const r=$('#nitRes');
  if(r){ const f=N.fet; r.hidden=!(f && f.src===S.src); if(f && f.src===S.src) r.textContent=f.text; }
}
async function preparaSessioNitida(progres){
  const N=IA.nitida;
  if(N.que==='soroll'){
    if(!N.sessio){
      const b=await baixaIA(N.fitxer,(a,t)=>progres('la IA del soroll',a,t||N.mb*1048576));
      progres('preparant el model',0,0);
      const r=await creaSessio(b); N.sessio=r.sessio; N.motorReal=r.motorReal;
    }
    return N.sessio;
  }
  // el borrós: el model lleuger d'ampliar (si ja és obert per ampliar, el mateix)
  if(IA.sessio && IA.sessioDe==='mobil'){ N.motorReal=IA.motorReal; return IA.sessio; }
  if(!N.sBorros){
    const md=IA.models.mobil;
    const b=await baixaIA(md.fitxer,(a,t)=>progres('la IA',a,t||md.mb*1048576));
    progres('preparant el model',0,0);
    const r=await creaSessio(b); N.sBorros=r.sessio; N.motorBorros=r.motorReal;
  }
  N.motorReal=N.motorBorros;
  return N.sBorros;
}
async function fesNitida(){
  if(IA.treballant || !baseCanvas) return;
  if(IA.motor==null){ say('Un moment: encara s\'està mirant què pot fer servir aquest aparell.'); return; }
  cancelaEndreca(); if(cropOn){ endCrop(false); setTool('move'); } hideTextEdit();
  const N=IA.nitida, soroll=N.que==='soroll', forca=N.forca, src=baseCanvas;
  const que=soroll ? 'Traient el soroll' : 'Fent-la més nítida';
  IA.treballant=true; IA.atura=false; estatNitida();
  const t0=performance.now(); mantenEncesa();
  try{
    const progres=(q,a,t)=>{
      if(IA.atura) throw new Error('aturat');
      vel(t ? 'Baixant '+q+'…' : 'Preparant la IA…', t ? a/t : 0, t ? mb(a/1048576)+' de '+mb(t/1048576)+' · només la primera vegada' : 'Només la primera vegada.');
    };
    vel('Preparant…',0,'');
    await preparaMotor(progres);
    const sessio=await preparaSessioNitida(progres);
    if(IA.atura) throw new Error('aturat');
    let tInici=0, preguntat=false;
    vel(que+'…',0,'Començant pel primer tros…');
    const cadaTros=async (n,total)=>{
      if(n===1) tInici=performance.now();
      let detall='Tros '+n+' de '+total, queda=0;
      if(n>=2){ queda=(performance.now()-tInici)/(n-1)*(total-n)/1000; detall+=' · queden uns '+minuts(queda); }
      vel(que+'…', n/total, detall);
      document.title=round(n/total*100)+'% · '+(soroll?'Soroll':'Nitidesa')+' · '+TITOL;
      if(n>=2 && !preguntat && queda>IA.LLARG){
        preguntat=true;
        const t=performance.now();
        if(!(await preguntaTemps(queda))) IA.atura=true;
        tInici+=performance.now()-t;
      }
    };
    const res = soroll
      ? await ampliaImatge(src, sessio, 1, N.T-2*IA.MARGE, cadaTros, {k:1, fix:true})
      : await ampliaImatge(src, sessio, 1, IA.models.mobil.tros[IA.motor], cadaTros);
    if(IA.atura) throw new Error('aturat');
    // la força: el resultat damunt de l'original, més o menys transparent
    const out=mkCanvas(src.width,src.height), ox=out.getContext('2d');
    ox.drawImage(src,0,0);
    if(forca<1){ ox.globalAlpha=forca; ox.drawImage(res,0,0); ox.globalAlpha=1; }
    else { ox.clearRect(0,0,out.width,out.height); ox.drawImage(res,0,0); }
    S.src=out; S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
    buildBase(); scheduleRender();
    push(soroll ? 'Treu el soroll' : 'Fes-la més nítida');
    const temps=minuts((performance.now()-t0)/1000);
    N.fet={ src:S.src, text:'✓ '+(soroll?'Soroll tret':'Més nítida')+' en '+temps+', '+(N.motorReal==='gpu'?'amb la gràfica':'amb el processador')+
      '. Mantén premut «Abans» per comparar-la; si és massa, desfés-ho i prova «Suau».' };
    say((soroll?'Soroll tret':'Més nítida')+' en '+temps+'.');
    titolFet('✓ '+(soroll?'Soroll tret':'Més nítida')+' · '+TITOL);
  }catch(e){
    const msg=String(e&&e.message||e);
    document.title=TITOL;
    if(msg==='aturat') say('Aturat. La foto és com era.');
    else { say('No s\'ha pogut fer: '+msg+'.'); console.warn('Soroll i borrós:',e); }
  }finally{
    IA.treballant=false; IA.atura=false;
    try{ if(bloqueigPantalla) await bloqueigPantalla.release(); }catch(e){}
    bloqueigPantalla=null;
    $('#vel').hidden=true; $('#velPregunta').hidden=true; $('#velAtura').hidden=false;
    estatNitida();
  }
}

/* ===================================================================
   16f. posar color a les fotos en blanc i negre
   DDColor mira la foto en grisos, feta quadrada i petita (256 o 384 punts), i
   en treu els dos canals de color de l'espai Lab (a i b). Aquests es fan grans
   fins a la mida de la foto i s'hi ajunten amb la claredat (L) de la foto
   original: per això el detall no es perd, encara que la IA treballi en petit.
   La força multiplica el color (Suau = colors més apagats).
=================================================================== */
const LAB={ Xn:0.950456, Zn:1.088754 };
LAB.lin=new Float32Array(256).map((_,i)=>{ const v=i/255; return v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
LAB.srgb=new Uint8ClampedArray(4097).map((_,i)=>{ const v=i/4096; return Math.round(255*(v<=0.0031308 ? 12.92*v : 1.055*Math.pow(v,1/2.4)-0.055)); });
function labL(r,g,b){             // la claredat (L, de 0 a 100) d'un color sRGB
  const Y=0.212671*LAB.lin[r]+0.715160*LAB.lin[g]+0.072169*LAB.lin[b];
  return Y>0.008856 ? 116*Math.cbrt(Y)-16 : 903.3*Y;
}
function labARgb(L,a,b,o,j){      // Lab → sRGB (0-255), escrit a o[j..j+2]
  const fy=(L+16)/116, fx=fy+a/500, fz=fy-b/200;
  const inv=t=>t>0.206893 ? t*t*t : (t-16/116)/7.787;
  const X=LAB.Xn*inv(fx), Y=L>8 ? fy*fy*fy : L/903.3, Z=LAB.Zn*inv(fz);
  const R=3.240479*X-1.53715*Y-0.498535*Z, G=-0.969256*X+1.875991*Y+0.041556*Z, B=0.055648*X-0.204043*Y+1.057311*Z;
  const q=v=>LAB.srgb[v<=0?0:v>=1?4096:(v*4096+0.5)|0];
  o[j]=q(R); o[j+1]=q(G); o[j+2]=q(B);
}
/* Si la foto ja té colors (no és ni grisa ni sèpia), es diu: la IA els
   canviarà. La sèpia també té color, però sempre del mateix to: el que compta
   és com varia el to (en graus) entre els punts que tenen prou color. Amb les
   fotos de prova, la sèpia varia menys d'1° i les de color, més de 10°. */
function fotoTeColor(){
  const C=IA.color;
  if(C.teColor && C.teColor.de===baseCanvas) return C.teColor.si;
  const n=64, c=mkCanvas(n,n), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high'; x.drawImage(baseCanvas,0,0,n,n);
  const d=x.getImageData(0,0,n,n).data, f=t=>t>0.008856 ? Math.cbrt(t) : 7.787*t+16/116;
  let sx=0, sy=0, k=0;
  for(let i=0;i<d.length;i+=4){
    const r=LAB.lin[d[i]], g=LAB.lin[d[i+1]], b=LAB.lin[d[i+2]];
    const fx=f((0.412453*r+0.357580*g+0.180423*b)/LAB.Xn), fy=f(0.212671*r+0.715160*g+0.072169*b), fz=f((0.019334*r+0.119193*g+0.950227*b)/LAB.Zn);
    const A=500*(fx-fy), B=200*(fy-fz), cr=Math.hypot(A,B);
    if(cr>5){ sx+=A/cr; sy+=B/cr; k++; }
  }
  // desviació circular del to: 0° si tots els punts són del mateix to
  const R=k ? Math.hypot(sx,sy)/k : 1, graus=Math.sqrt(-2*Math.log(Math.max(R,1e-9)))*180/Math.PI;
  const si=k>n*n*0.1 && graus>6;
  C.teColor={de:baseCanvas, si};
  return si;
}
function estatColor(){
  const b=$('#colorGo'), info=$('#colorInfo'); if(!b||!info) return;
  b.disabled=IA.treballant || IA.motor==null || !baseCanvas;
  const C=IA.color, falta=[];
  if(IA.motor && !IA.baixats[IA.motors[IA.motor].wasm] && IA.carregat!==IA.motor) falta.push(IA.motors[IA.motor].mb);
  if(!C.parts.every(f=>IA.baixats[f]) && !C.sessio) falta.push(C.mb);
  const suma=falta.reduce((a,b)=>a+b,0);
  let t=suma ? 'La primera vegada es baixen '+mb(suma)+(IA.mode==='mobil'?' (millor amb wifi).':'.') : 'La IA ja és en aquest aparell.';
  t+=IA.mode==='mobil' ? ' Amb el mode Mòbil treballa més petita i va més de pressa.' : ' Amb el mode Ordinador treballa més gran: encerta una mica més els colors.';
  if(baseCanvas && fotoTeColor()) t+=' Aquesta foto ja té colors: la IA els canviarà pels seus.';
  info.textContent=t;
  const r=$('#colorRes');
  if(r){ const f=C.fet; r.hidden=!(f && f.src===S.src); if(f && f.src===S.src) r.textContent=f.text; }
}
async function preparaSessioColor(progres){
  const C=IA.color;
  if(C.sessio) return;
  const parts=[]; let fet=0;
  for(const f of C.parts){
    parts.push(await baixaIA(f,(a,t)=>progres('la IA del color',fet+a,C.mb*1048576)));
    fet+=parts[parts.length-1].length;
  }
  const tot=new Uint8Array(fet); let o=0; for(const p of parts){ tot.set(p,o); o+=p.length; }
  parts.length=0;
  progres('preparant el model',0,0);
  const r=await creaSessio(tot);
  C.sessio=r.sessio; C.motorReal=r.motorReal;
}
/* El color de tota la foto: la foto en grisos a N × N, pel model, i el que en
   surt (a i b) es fa gran fins a la mida de la foto i s'hi ajunta la seva L. */
async function acoloreix(src, N, forca){
  const W=src.width, H=src.height;
  const c=mkCanvas(N,N), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high'; x.drawImage(src,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data, P=N*N, e=new Float32Array(3*P);
  for(let i=0,j=0;i<P;i++,j+=4){ const g=(0.299*d[j]+0.587*d[j+1]+0.114*d[j+2])/255; e[i]=e[P+i]=e[2*P+i]=g; }
  const s=IA.color.sessio;
  const res=await s.run({[s.inputNames[0]]: new ort.Tensor('float32',e,[1,3,N,N])});
  const ab=res[s.outputNames[0]].data;
  // a i b, fets grans amb interpolació lineal (com cv2.resize)
  const sx=new Float32Array(W), ix=new Int32Array(W);
  for(let X=0;X<W;X++){ let u=(X+0.5)*N/W-0.5; u=Math.max(0,Math.min(N-1,u)); ix[X]=Math.min(N-2,u|0); sx[X]=u-ix[X]; }
  const sc=src.getContext('2d',{willReadFrequently:true}), img=sc.getImageData(0,0,W,H), p=img.data;
  for(let Y=0;Y<H;Y++){
    let v=(Y+0.5)*N/H-0.5; v=Math.max(0,Math.min(N-1,v)); const iy=Math.min(N-2,v|0), fy=v-iy;
    const f0=iy*N, f1=f0+N;
    for(let X=0;X<W;X++){
      const a0=ix[X], fx=sx[X], k=(Y*W+X)*4;
      const i00=f0+a0, i10=f1+a0;
      const A=((ab[i00]*(1-fx)+ab[i00+1]*fx)*(1-fy)+(ab[i10]*(1-fx)+ab[i10+1]*fx)*fy)*forca;
      const B=((ab[P+i00]*(1-fx)+ab[P+i00+1]*fx)*(1-fy)+(ab[P+i10]*(1-fx)+ab[P+i10+1]*fx)*fy)*forca;
      labARgb(labL(p[k],p[k+1],p[k+2]),A,B,p,k);
    }
  }
  const out=mkCanvas(W,H); out.getContext('2d').putImageData(img,0,0);
  return out;
}
async function posaColor(){
  if(IA.treballant || !baseCanvas) return;
  if(IA.motor==null){ say('Un moment: encara s\'està mirant què pot fer servir aquest aparell.'); return; }
  cancelaEndreca(); if(cropOn){ endCrop(false); setTool('move'); } hideTextEdit();
  IA.treballant=true; IA.atura=false; estatColor();
  const t0=performance.now(); mantenEncesa();
  try{
    const progres=(que,a,t)=>{
      if(IA.atura) throw new Error('aturat');
      vel(t ? 'Baixant '+que+'…' : 'Preparant la IA…', t ? a/t : 0, t ? mb(a/1048576)+' de '+mb(t/1048576)+' · només la primera vegada' : 'Només la primera vegada.');
    };
    vel('Preparant…',0,'');
    await preparaMotor(progres);
    await preparaSessioColor(progres);
    if(IA.atura) throw new Error('aturat');
    const N=IA.color.N[IA.mode];
    vel('Posant color…',0,IA.color.motorReal==='gpu' ? 'Amb la gràfica.' : 'Amb el processador: pot trigar una mica.');
    await new Promise(r=>setTimeout(r,30));
    const feina=await acoloreix(baseCanvas, N, IA.color.forca);
    if(IA.atura) throw new Error('aturat');
    // com quan s'esborra o s'amplia, la foto nova passa a ser la foto
    S.src=feina; S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
    buildBase(); scheduleRender();
    push('Posa color');
    const temps=minuts((performance.now()-t0)/1000);
    IA.color.fet={ src:S.src, text:'✓ Color posat en '+temps+', '+(IA.color.motorReal==='gpu'?'amb la gràfica':'amb el processador')+
      '. Es pot retocar amb la temperatura i la saturació, a Ajustos. Si és massa viu, desfés-ho i prova «Suau».' };
    say('Color posat en '+temps+'.');
  }catch(e){
    const msg=String(e&&e.message||e);
    if(msg==='aturat') say('Aturat. La foto és com era.');
    else { say('No s\'ha pogut posar color: '+msg+'.'); console.warn('Color:',e); }
  }finally{
    IA.treballant=false; IA.atura=false;
    try{ if(bloqueigPantalla) await bloqueigPantalla.release(); }catch(e){}
    bloqueigPantalla=null;
    $('#vel').hidden=true;
    estatColor();
  }
}

/* ===================================================================
   16c. treure el fons
   Una xarxa neuronal diu, per a cada punt de la foto, si és del que hi ha al
   davant (una persona, un objecte) o del fons. Amb això, el fons es fa
   transparent, d'un color, o es difumina com a les fotos de retrat del mòbil.
   Mateix motor que ampliar i esborrar; la foto no surt de l'aparell.
=================================================================== */
const DARRERE=[['transparent','Transparent'],['blanc','Blanc'],['color','Un color'],['difuminat','Difuminat']];
function pintaFons(){
  const pane=$('#pane-fons'); if(!pane || !baseCanvas) return;
  const F=IA.fons, md=F.models[IA.mode];
  pane.textContent='';
  if(F.fet && F.fet.src===S.src){
    const ok=el('div','ia-fet'); ok.id='fonsFet'; ok.innerHTML='<b>✓ Fet.</b> '+F.fet.text; pane.appendChild(ok);
  }
  const g1=el('div','grp');
  g1.appendChild(el('div','tiny','Deixa sol el que hi ha al davant (una persona, un animal, un objecte) i en treu el fons, o el difumina. Va millor quan el que hi ha al davant es distingeix bé. Amb el mode '+IA.models[IA.mode].nom+': '+md.desc.toLowerCase().replace(/\.$/,'')+' ('+mb(md.mb)+').'));
  pane.appendChild(g1);

  const g3=el('div','grp'); g3.appendChild(el('h4',null,'Què hi poso al darrere'));
  const chips=el('div','chips');
  for(const [v,lab] of DARRERE){
    const c=el('button','chip',lab); c.type='button'; c.id='fonsD-'+v;
    c.setAttribute('aria-pressed', v===F.darrere?'true':'false');
    c.onclick=()=>{ F.darrere=v; pintaFons(); };
    chips.appendChild(c);
  }
  g3.appendChild(chips);
  if(F.darrere==='color'){
    const row=el('div','optrow');
    const sw=el('button','swatch'); sw.type='button'; sw.title='Color del fons';
    const inp=document.createElement('input'); inp.type='color'; inp.value=F.color; inp.id='fonsColor';
    inp.oninput=()=>{ F.color=inp.value; sw.style.background=inp.value; };
    sw.style.background=F.color; sw.appendChild(inp);
    sw.onclick=e=>{ if(e.target!==inp) inp.click(); };
    row.append(sw, el('span','tiny','Toca el quadre per triar el color'));
    g3.appendChild(row);
  }
  const expl={
    transparent:'Es veu com un escaquer. Per desar-la transparent, desa en PNG: el JPG no guarda la transparència i hi posaria blanc.',
    blanc:'Com les fotos de carnet o de les botigues per internet.',
    color:'Un fons llis del color que triïs.',
    difuminat:'Com el mode retrat del mòbil: el fons es queda, però borrós, i el que hi ha al davant destaca.',
  }[F.darrere];
  g3.appendChild(el('div','tiny',expl));
  pane.appendChild(g3);

  const linies=el('div','ia-linies'); linies.id='fonsLinies';
  const linia=(t,c)=>linies.appendChild(el('div','tiny'+(c?' '+c:''),t));
  if(IA.motor==null) linia('Mirant si aquest aparell pot fer servir la gràfica…');
  else {
    const falta=[], mot=IA.motors[IA.motor];
    if(!IA.baixats[mot.wasm] && IA.carregat!==IA.motor) falta.push(mot.mb);
    if(!IA.baixats[md.fitxer] && !(F.sessio && F.sessioDe===IA.mode)) falta.push(md.mb);
    const suma=falta.reduce((a,b)=>a+b,0);
    linia(suma ? 'La primera vegada es baixen '+mb(suma)+'. Després queden desats en aquest navegador, també sense connexió.'
               : 'La IA ja és en aquest navegador: no cal baixar res.');
    if(IA.motor==='cpu' && IA.mode==='ordinador') linia('Sense gràfica, el model gran pot trigar una estona.','ia-avis');
  }
  if(F.error) linia('L\'última vegada no ha funcionat: '+F.error+'.','ia-mal');
  pane.appendChild(linies);

  const go=el('button','btn primary',F.darrere==='difuminat'?'Difumina el fons':'Treu el fons'); go.type='button'; go.id='fonsGo';
  go.style.cssText='width:100%;height:38px;justify-content:center;font-size:13px';
  go.disabled=IA.motor==null || IA.treballant;
  go.onclick=fesFons;
  pane.appendChild(go);
}

async function preparaSessioFons(progres){
  const F=IA.fons;
  if(F.sessio && F.sessioDe===IA.mode) return F.sessio;
  if(F.sessio){ try{ await F.sessio.release(); }catch(e){} F.sessio=null; F.sessioDe=null; }
  const md=F.models[IA.mode];
  const bytes=await baixaIA(md.fitxer, (a,t)=>progres('la IA',a,t||md.mb*1048576));
  progres('preparant el model',0,0);
  const r=await creaSessio(bytes);
  F.sessio=r.sessio; F.motorReal=r.motorReal; F.errorGPU=r.errorGPU; F.sessioDe=IA.mode;
  return F.sessio;
}

/* Què és del davant. El model mira la foto reduïda a 320 o 1024 punts de
   costat i en treu un mapa (1 = davant, 0 = fons); el mapa es torna a fer de
   la mida de la foto, amb les vores suaus. Es prepara com al projecte
   d'on surten els models (rembg): dividida pel punt més clar, i amb la
   mitjana i la desviació de cada model. */
async function alfaDelDavant(src, sessio, md){
  const N=md.N, W=src.width, H=src.height;
  const c=mkCanvas(N,N), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high';
  x.drawImage(src,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data, P=N*N, e=new Float32Array(3*P);
  let mx=1; for(let k=0;k<d.length;k+=4) mx=Math.max(mx,d[k],d[k+1],d[k+2]);
  for(let i=0,k=0;i<P;i++,k+=4)
    for(let ch=0;ch<3;ch++) e[ch*P+i]=(d[k+ch]/mx-md.mitjana[ch])/md.desv[ch];
  const res=await sessio.run({[sessio.inputNames[0]]: new ort.Tensor('float32',e,[1,3,N,N])});
  const sortida=res[sessio.outputNames[0]], y=sortida.data;
  let lo=Infinity, hi=-Infinity; for(let i=0;i<P;i++){ if(y[i]<lo) lo=y[i]; if(y[i]>hi) hi=y[i]; }
  const esc=hi-lo>1e-6 ? 1/(hi-lo) : 0;
  // el mapa, petit: blanc amb la transparència que diu el model. Els punts
  // gairebé segurs es fan segurs del tot: si no, el fons quedaria com una boira
  const petita=mkCanvas(N,N), px=petita.getContext('2d',{willReadFrequently:true});
  const pm=px.createImageData(N,N), q=pm.data;
  for(let i=0,k=0;i<P;i++,k+=4){
    const a=clamp(((y[i]-lo)*esc-0.04)/0.92,0,1);
    q[k]=q[k+1]=q[k+2]=255; q[k+3]=a*255;
  }
  if(sortida.dispose) sortida.dispose();
  px.putImageData(pm,0,0);
  // de la mida de la foto
  const gran=mkCanvas(W,H), gx=gran.getContext('2d',{willReadFrequently:true});
  gx.imageSmoothingQuality='high';
  gx.drawImage(petita,0,0,W,H);
  const g=gx.getImageData(0,0,W,H).data, alfa=new Uint8ClampedArray(W*H);
  for(let i=0,k=3;i<alfa.length;i++,k+=4) alfa[i]=g[k];
  return { alfa, petita };
}

/* El fons difuminat, sense que el del davant s'hi escampi: es difumina el
   fons tot sol (cada punt pesa el que té de fons) i es divideix pel pes. Si
   es difuminés la foto sencera, al voltant de la persona quedaria una aura
   del seu color. Es fa a 900 punts com a molt (difuminat, no es nota) i es
   torna a fer gran. */
function fonsDifuminat(src, petita){
  const W=src.width, H=src.height, s=Math.min(1,900/Math.max(W,H));
  const w=Math.max(1,round(W*s)), h=Math.max(1,round(H*s));
  const c=mkCanvas(w,h), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high';
  x.drawImage(src,0,0,w,h); const im=x.getImageData(0,0,w,h), d=im.data;
  x.clearRect(0,0,w,h); x.drawImage(petita,0,0,w,h); const a=x.getImageData(0,0,w,h).data;
  const p=new Uint8ClampedArray(d.length), tot=new Uint8ClampedArray(d);
  for(let k=0;k<d.length;k+=4){
    const wg=1-a[k+3]/255;
    p[k]=d[k]*wg; p[k+1]=d[k+1]*wg; p[k+2]=d[k+2]*wg; p[k+3]=wg*255;
  }
  const r=Math.max(2,Math.max(w,h)*0.022);
  boxBlur(p,w,h,r,3); boxBlur(tot,w,h,r,3);
  for(let k=0;k<d.length;k+=4){
    const pes=p[k+3];
    if(pes>24){ d[k]=p[k]*255/pes; d[k+1]=p[k+1]*255/pes; d[k+2]=p[k+2]*255/pes; }
    else { d[k]=tot[k]; d[k+1]=tot[k+1]; d[k+2]=tot[k+2]; }   // al mig d'una persona gran no hi ha fons a prop
    d[k+3]=255;
  }
  x.putImageData(im,0,0);
  const gran=mkCanvas(W,H), gx=gran.getContext('2d',{willReadFrequently:true});
  gx.imageSmoothingQuality='high'; gx.drawImage(c,0,0,W,H);
  return gx.getImageData(0,0,W,H).data;
}

function componFons(src, {alfa, petita}, darrere, color){
  const W=src.width, H=src.height;
  const out=mkCanvas(W,H), ox=out.getContext('2d',{willReadFrequently:true});
  ox.drawImage(src,0,0);
  const im=ox.getImageData(0,0,W,H), d=im.data;
  if(darrere==='transparent'){
    for(let i=0,k=3;i<alfa.length;i++,k+=4) d[k]=d[k]*alfa[i]/255;
  } else {
    let bg=null, c=[255,255,255];
    if(darrere==='color'){ const n=parseInt(color.slice(1),16); c=[n>>16&255,n>>8&255,n&255]; }
    if(darrere==='difuminat') bg=fonsDifuminat(src, petita);
    for(let i=0,k=0;i<alfa.length;i++,k+=4){
      const a=alfa[i]/255*d[k+3]/255, b=1-a;
      if(bg){ d[k]=d[k]*a+bg[k]*b; d[k+1]=d[k+1]*a+bg[k+1]*b; d[k+2]=d[k+2]*a+bg[k+2]*b; }
      else  { d[k]=d[k]*a+c[0]*b;  d[k+1]=d[k+1]*a+c[1]*b;  d[k+2]=d[k+2]*a+c[2]*b; }
      d[k+3]=255;
    }
  }
  ox.putImageData(im,0,0);
  return out;
}

async function fesFons(){
  if(IA.treballant || !baseCanvas) return;
  if(IA.motor==null){ say('Un moment: encara s\'està mirant què pot fer servir aquest aparell.'); return; }
  cancelaEndreca();
  if(cropOn){ endCrop(false); setTool('move'); }
  hideTextEdit();
  const F=IA.fons, md=F.models[IA.mode], src=baseCanvas, darrere=F.darrere, t0=performance.now();
  IA.treballant=true; IA.atura=false; F.error=null;
  mantenEncesa();
  try{
    const progres=(que,a,t)=>{
      if(IA.atura) throw new Error('aturat');
      vel(t ? 'Baixant '+que+'…' : 'Preparant la IA…', t ? a/t : 0, t ? mb(a/1048576)+' de '+mb(t/1048576)+' · només la primera vegada' : 'Només la primera vegada.');
    };
    vel('Preparant…',0,'');
    await preparaMotor(progres);
    const sessio=await preparaSessioFons(progres);
    if(IA.atura) throw new Error('aturat');
    vel('Buscant què hi ha al davant…',1,F.motorReal==='gpu'?'Amb la gràfica.':'Amb el processador: pot trigar uns segons.');
    const mapa=await alfaDelDavant(src, sessio, md);
    if(IA.atura) throw new Error('aturat');
    vel(darrere==='difuminat'?'Difuminant el fons…':'Traient el fons…',1,'');
    await new Promise(r=>setTimeout(r,30));     // que el vel es pinti abans de la feina
    const nova=componFons(src, mapa, darrere, F.color);
    // Com quan s'esborra o s'amplia, la foto nova passa a ser la foto: els
    // girs i el retall ja hi són, les pinzellades no es mouen i desfer torna
    // a la d'abans.
    S.src=nova; S.rot=0; S.flipH=false; S.flipV=false; S.crop=null;
    buildBase(); scheduleRender();
    const nom={transparent:'transparent',blanc:'blanc',color:'de color',difuminat:'difuminat'}[darrere];
    push(darrere==='difuminat'?'Difumina el fons':'Treu el fons ('+nom+')');
    const temps=minuts((performance.now()-t0)/1000);
    F.fet={ src:S.src, text:(darrere==='difuminat'?'Fons difuminat':'Fons '+nom)+' en '+temps+', '+(F.motorReal==='gpu'?'amb la gràfica':'amb el processador')+
      '. Si s\'hi ha menjat un tros o se n\'ha deixat, desfés-ho i prova el mode '+(IA.mode==='mobil'?'Ordinador, que és més fi':'Mòbil')+'.'+
      (darrere==='transparent'?' Per desar-la transparent, en <b>PNG</b>.':'') };
    say((darrere==='difuminat'?'Fons difuminat':'Fons tret')+' en '+temps+'. Si no t\'agrada, desfés-ho.');
  }catch(e){
    const msg=String(e&&e.message||e);
    if(msg==='aturat') say('Aturat. La foto és com era.');
    else { F.error=msg; say('No s\'ha pogut treure el fons: '+msg+'.'); console.warn('Fons:',e); }
  }finally{
    IA.treballant=false; IA.atura=false;
    try{ if(bloqueigPantalla) await bloqueigPantalla.release(); }catch(e){}
    bloqueigPantalla=null;
    $('#vel').hidden=true;
    pintaFons();
  }
}

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  const k=e.key.toLowerCase();
  if(IA.treballant){ if(k==='escape') IA.atura=true; e.preventDefault(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='s'){ e.preventDefault(); saveDialog(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='o'){ e.preventDefault(); $('#file').click(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const map={v:'move',c:'crop',b:'brush',e:'eraser',s:'clone',x:'treu',t:'text',i:'pick'};
  if(map[k]){ e.preventDefault(); setTool(map[k]); return; }
  if(k==='\\'){ e.preventDefault(); mostraAbans(true); return; }
  if(k==='enter'&&cropOn){ e.preventDefault(); endCrop(true); setTool('move'); return; }
  if(k==='escape' && S.mascara.length){ netejaVermell(); return; }
  if(k==='escape'){ if(cropOn){ endCrop(false); setTool('move'); } hideTextEdit(); return; }
  if(k==='0'){ e.preventDefault(); fitToStage(); return; }
  if(k==='1'){ e.preventDefault(); setZoom(1); return; }
  if(k==='+'||k==='='){ e.preventDefault(); setZoom(S.zoom*1.25); return; }
  if(k==='-'){ e.preventDefault(); setZoom(S.zoom/1.25); return; }
  if(k==='['){ S.brush.size=clamp(round(S.brush.size*0.8),1,400); refreshBrushUI(); return; }
  if(k===']'){ S.brush.size=clamp(round(S.brush.size*1.25)+1,1,400); refreshBrushUI(); return; }
});
function refreshBrushUI(){
  updateCursorSize();
  if(['brush','eraser','clone','treu'].includes(S.tool)) buildOpts(S.tool,TOOLS.find(x=>x.id===S.tool).hint);
  say('Pinzell: '+S.brush.size+' px');
}

window.addEventListener('resize',()=>{

});

/* Instal·lar-la com una app. El programa que la deixa anar sense connexió
   (cambra-fosca-sw.js) només s'ocupa d'aquesta pàgina, no de la portada ni de
   la Revisió. El botó INSTAL·LA només surt quan el navegador diu que es pot
   (al Chrome i l'Edge); a la resta, ho diu l'ajuda. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('cambra-fosca-sw.js',{scope:'./cambra-fosca'}).catch(e=>console.warn('Sense connexió no anirà:',e));
}
let promptInstal=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstal=e; $('#btnInstal').hidden=false; });
$('#btnInstal').onclick=async()=>{
  if(!promptInstal) return;
  promptInstal.prompt();
  const r=await promptInstal.userChoice.catch(()=>({outcome:'dismissed'}));
  promptInstal=null; $('#btnInstal').hidden=true;
  if(r.outcome!=='accepted') say('D\'acord. Si més endavant la vols instal·lar, ho tens al menú del navegador.');
};
addEventListener('appinstalled',()=>{ $('#btnInstal').hidden=true; say('Instal·lada. La trobaràs entre les apps, amb el llum taronja.'); });

})();
